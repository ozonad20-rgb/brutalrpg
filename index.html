function confirmBox(title,text,yes,fn){S.modal={t:'confirm',title,text,yes,fn};render()}
/* ações que mudam dados: entram na pilha do Ctrl+Z */
const MUT=new Set(['confirmYes','pickYes','rmCover','cena','kstep','dstep','intento','kferir','gmpcYes','newNPC','reward','blank','wzDone','setPilha','setFuga','setPT','sstep','roll',
  'folego','incap','apego','vant','madd','mstep','mdel','npcRoll','saveCrop','rmFoto','ptplus','nextTurn','susto','freeroll','quick','hab','tudoYes','kferir','kacid','kposs','krestr','kdo','kacao']);
const LBL={setPilha:'Pilha Comum',setFuga:'Pilha de Fuga',setPT:'Pontos de Tensão',kstep:'Ajuste do Assassino',dstep:'Pilha de Descarte',intento:'Intento Horrível',
  kferir:'Ferir',madd:'Novo marcador',mstep:'Valor do marcador',mdel:'Remover marcador',incap:'Estilo incapacitado',rmFoto:'Remover foto',rmCover:'Remover capa',
  ptplus:'+1 PT (Desafio)',hab:'Habilidade',tudoYes:'Arriscar Tudo',kacao:'Ações Únicas',kposs:'Possuir',krestr:'Restringir',kacid:'Acidentar',nextTurn:'Próximo turno',susto:'Assustar',saveCrop:'Imagem',cena:'Mudar cena',freeroll:'Rolagem livre',quick:'Rolagem livre',wzDone:'Criar Sobrevivente',blank:'Criar ficha'};
document.addEventListener('click',async e=>{const t=e.target.closest('[data-act]');if(!t)return;const act=t.dataset.act,v=t.dataset.v,id=t.dataset.id;
  if(t.tagName==='SELECT'||t.type==='file'||t.tagName==='INPUT')return;
  if(act==='scrim'){if(e.target===t&&S.modal?.t!=='crop'){S.modal=null;render()}return}
  const sh=id?getSheet(id):null;
  const label=(act==='confirmYes'||act==='pickYes')?(S.modal?.yes||'Confirmar'):(LBL[act]||t.textContent.replace(/\s+/g,' ').trim().slice(0,40)||act);
  const run=async()=>{switch(act){
  case 'authMode':S.authMode=v;S.authErr='';S.authInfo='';render();break;
  case 'showpw':S.showPw=!S.showPw;render();break;
  case 'forgot':await sendReset();break;
  case 'reload':location.reload();break;
  case 'mName':S.modal={t:'name'};render();$('#nmi')?.focus();break;
  case 'logout':logout();break;
  case 'home':goHome();break;
  case 'homeTab':S.homeTab=v;render();break;
  case 'undo':await undo();break;
  case 'redo':await redo();break;
  case 'mJoin':S.modal={t:'join'};render();$('#jc')?.focus();break;
  case 'mCreate':S.modal={t:'create'};render();$('#cn')?.focus();break;
  case 'close':S.modal=null;S.crop=null;render();break;
  case 'confirmYes':{const f=S.modal.fn;S.modal=null;render();if(f)await f();break}
  case 'pickYes':{const f=S.modal.fn,pid=$('#pk').value;S.modal=null;if(f)await f(pid);break}
  case 'open':openCamp(v);break;
  case 'mDel':{const c=S.camps.find(x=>x.id===v);confirmBox('Deletar campanha?',`"${c?.name}" será apagada para todos, com fichas, rolagens e recompensas. Isso não pode ser desfeito.`,'Deletar para sempre',()=>deleteCamp(v));break}
  case 'mLeave':{const c=S.camps.find(x=>x.id===v);confirmBox('Sair da campanha?',`Você deixa "${c?.name}". Para voltar, precisará do código de novo.`,'Sair',()=>leaveCamp(v));break}
  case 'tab':S.tab=v;if(v==='create')S.wiz=null;render();window.scrollTo(0,0);break;
  case 'copy':try{await navigator.clipboard.writeText(v);toast('Código copiado.')}catch(x){toast('Código: '+v)}break;
  case 'rmCover':updCamp({cover:null});break;
  case 'cena':await setCena(v);break;
  case 'nextTurn':nextTurn();break;
  case 'susto':pedirSusto();break;
  case 'mSession':confirmBox('Iniciar nova sessão?','Libera de novo o Item Icônico, a Relação Afetiva, o Arriscar Tudo e as Habilidades de uso por sessão de todas as Sobreviventes.','Iniciar sessão',newSession);break;
  case 'kstep':{const k=ck(),f=t.dataset.f;const nv=clamp((k[f]||0)+(+t.dataset.d),0,f==='fugaAlvo'?6:99);updCamp({killer:{[f]:nv}});break}
  case 'dstep':updCamp({descarte:Math.max(0,(S.camp.descarte||0)+(+t.dataset.d))});break;
  case 'intento':updCamp({killer:{ph:(ck().ph||0)+(+v)}});toast(`+${v} PH para o Assassino`);break;
  case 'ktgt':S.ktgt=v;S.kopt.incapStyle='';render();break;
  case 'kferir':{const ac=kAcoes(ck());await killerAct('ferir',S.ktgt,{incap:S.kopt.incap&&ac.includes('incapacitar'),incapStyle:S.kopt.incapStyle||(getSheet(S.ktgt)?.estilos||[]).find(e=>!(getSheet(S.ktgt).incap||[]).includes(e)),segurar:S.kopt.segurar&&ac.includes('segurar'),mutilar:S.kopt.mutilar});
    S.kopt={incap:false,incapStyle:'',segurar:false,mutilar:false};break}
  case 'kacid':await killerAct('ferir',S.ktgt,{acidentar:true});break;
  case 'kposs':await killerAct('possuir',S.ktgt);break;
  case 'krestr':await killerAct('restringir',S.ktgt);break;
  case 'kdo':await kDo(v,v==='hora'?$('#khora')?.value:v==='planos'?[$('#kplrm')?.value,$('#kpladd')?.value]:null);break;
  case 'kacao':{const ac=[...kAcoes(ck())];const i=ac.indexOf(v);if(i>=0)ac.splice(i,1);else{if(ac.length>=2)return toast('O Assassino tem 2 Ações Únicas. Desmarque uma antes.');ac.push(v)}updCamp({killer:{acoes:ac,preset:'custom'}});break}
  case 'kmatar':{const tt=getSheet(S.ktgt);if(!tt)break;const via=v?getSheet(v):null;
    confirmBox('Matar '+(tt.name||'a Sobrevivente')+'?',(via?`Pelas mãos de ${via.name}, que está possuída. `:'')+'A ficha fica marcada como morta. Ctrl+Z desfaz.','Matar',()=>killerAct('matar',S.ktgt,{via:v||null}));break}
  case 'freeroll':S.lastRes.__free=freeRoll(clamp(+S.free.n||1,1,100),clamp(+S.free.s||6,2,1000),0,'Mestre');render();break;
  case 'quick':S.lastRes.__free=freeRoll(1,+v,0,'Mestre');render();break;
  case 'gmNewPC':S.modal={t:'gmpc'};render();break;
  case 'gmpcYes':{const o=$('#gpo').value||null;S.modal=null;await newSheet(blankPC(o));break}
  case 'newNPC':await newSheet(blankNPC());break;
  case 'openSheet':S.sheetId=v;S.tab='sheet';render();window.scrollTo(0,0);break;
  case 'rwkind':S.rw.kind=v;render();break;
  case 'rwall':{const pcs=S.sheets.filter(s=>s.kind==='pc');const all=pcs.every(s=>S.rw.sel[s.id]);pcs.forEach(s=>S.rw.sel[s.id]=!all);render();break}
  case 'reward':await giveReward();break;
  case 'revert':confirmBox('Reverter recompensa?','O valor é subtraído das fichas que receberam.','Reverter',()=>revertReward(v));break;
  case 'mResetXP':S.modal={t:'pick',title:'Resetar XP',text:'Zera o XP disponível da ficha escolhida. O resto da ficha não muda.',yes:'Zerar XP',fn:resetXP};render();break;
  case 'mClear':S.modal={t:'pick',title:'Limpar ficha',text:'Deixa a ficha toda em branco, mantendo apenas o jogador atribuído.',yes:'Limpar ficha',fn:pid=>confirmBox('Tem certeza?','A ficha ficará totalmente em branco. Ctrl+Z desfaz.','Limpar',()=>clearSheet(pid))};render();break;
  case 'mDelSheet':confirmBox('Apagar ficha?','A ficha some da campanha para todos. Ctrl+Z desfaz enquanto você estiver nesta mesa.','Apagar',()=>deleteSheet(v));break;
  case 'wizStart':S.wiz={step:0,d:{name:'',conceito:'',arq:'',item:'',relacao:'',desejo:'',foto:null}};render();break;
  case 'blank':await newSheet(blankPC(S.u));break;
  case 'wzArq':S.wiz.d.arq=v;render();break;
  case 'wzGo':S.wiz.step=+v;render();break;
  case 'wzBack':if(S.wiz.step)S.wiz.step--;else S.wiz=null;render();break;
  case 'wzNext':S.wiz.step++;render();window.scrollTo(0,0);break;
  case 'wzDone':{const w=S.wiz.d,b=blankPC(S.u);Object.assign(b,{name:w.name,conceito:w.conceito,arq:w.arq,estilos:[...ARQ[w.arq].e],tracos:ARQ[w.arq].tr,pilha:6,foto:w.foto||null});
    b.apegos={...b.apegos,item:w.item,relacao:w.relacao,desejo:w.desejo};await newSheet(b);toast('Sobrevivente criada.');break}
  case 'setPilha':{const n=+v===(sh.pilha||0)?+v-1:+v;updSheet(id,{pilha:n});break}
  case 'setFuga':{const n=+v===(sh.fuga||0)?+v-1:+v;const p={fuga:n};if(n>=(ck().fugaAlvo||6)&&sh.status==='viva')p.status='escapou';updSheet(id,p);break}
  case 'setPT':{const n=+v===(sh.pt||0)?+v-1:+v;updSheet(id,{pt:n});break}
  case 'sstep':{const f=t.dataset.f,mx=+(t.dataset.max||99);updSheet(id,{[f]:clamp((sh[f]||0)+(+t.dataset.d),0,mx)});break}
  case 'ptplus':updSheet(id,{pt:clamp((sh.pt||0)+1,0,10)});toast(`+1 PT para ${sh.name||'a Sobrevivente'}`);break;
  case 'rmFoto':updSheet(id,{foto:null});break;
  case 'rn':{const r=S.roll[id];r.n=clamp(r.n+(+t.dataset.d),1,Math.max(1,sh.pilha||0));render();break}
  case 'rcx':S.roll[id].complexo=v==='1';render();break;
  case 'roll':{const r=S.roll[id]||(S.roll[id]={n:1,estilo:'',complexo:false,recurso:false,alvo:''});const est=v==='susto'?'':({vazar:'Ligeiro',partir:'Potente',distrair:'Desenrolado',libertar:'Potente'}[v]||t.dataset.e||(v==='ajudar'?r.ajEst:r.estilo));
    if((v==='ajudar'||v==='libertar')&&!r.alvo)return toast('Escolha a aliada no seletor.');
    let n=r.n;if(v==='distrair'||v==='libertar')n=Math.max(n,Math.min(2,sh.pilha||0));
    await brutal(id,{act:v,n,estilo:est,complexo:(v==='distrair'||v==='libertar')?true:(S.camp.cena==='encontro'?false:r.complexo),recurso:r.recurso&&(sh.recursos||0)>0,alvo:r.alvo});r.recurso=false;break}
  case 'folego':if((sh.pilha||0)>=6)return toast('A Pilha Comum já está cheia.');
    updSheet(id,{pilha:(sh.pilha||0)+1});if(S.camp.descarte>0)updCamp({descarte:S.camp.descarte-1});
    afterTurn(id);await logRoll({kind:'brutal',who:sh.name||'Sem nome',label:'Recuperar Fôlego',dice:[],summary:'+1 dado na Pilha Comum'});break;
  case 'mTudo':S.modal={t:'tudo',id};render();break;
  case 'tudoYes':{const m=S.modal,me=getSheet(m.id),tid=$('#tudoT')?.value;if(!me||!tid)break;S.modal=null;const tt=getSheet(tid);
    const keep=(me.arq==='heroina'&&tid===me.id)?Math.min(1,me.pilha||0):0;const lost=(me.pilha||0)-keep;
    if(tid===me.id)updSheet(me.id,{pilha:keep,status:'escapou',flags:{tudoSes:true}});else{updSheet(me.id,{pilha:keep,flags:{tudoSes:true}});updSheet(tid,{status:'escapou'})}
    updCamp({descarte:(S.camp.descarte||0)+lost,tudoEnc:true});afterTurn(me.id);
    await logRoll({kind:'brutal',who:me.name||'Sem nome',label:'Arriscar Tudo',dice:[],summary:`${tid===me.id?'Escapou':(tt?.name||'Uma aliada')+' escapou'} do Encontro · ${lost} dado(s) descartado(s)${keep?' · Até o Fim: manteve 1':''}`});break}
  case 'hab':{const h=HAB[sh.arq],a=ARQ[sh.arq];if(!h||h.auto)break;if(habUsed(sh,h))return toast('Habilidade já usada.');const enc_=S.camp.cena==='encontro';
    const p={flags:{[h.rec==='enc'?'habEnc':'habSes']:true}};let sum=a.hab,nv=null;
    if(['nerd','valentona','inocente'].includes(sh.arq)&&!enc_)return toast(a.hab+' só vale durante um Encontro.');
    if(sh.arq==='nerd'){const f=Math.max(0,(ck().fugaAlvo||6)-(sh.fuga||0));sum+=`: faltam ${f} dado(s) para completar a Pilha de Fuga.`;toast(`Faltam ${f} dado(s) para a sua Fuga.`)}
    if(sh.arq==='relaxada'){const uf=sh.ultFerida;if(!uf)return toast('Olé vale logo depois de sofrer uma Ferida.');nv=d(6);const ms=(sh.marcadores||[]).map(m=>({...m}));const i=ms.findIndex(m=>m.tipo==='Ferida');
      const val=Math.max((uf.antes||0)+nv,sh.sequelas||0);if(i>=0)ms[i].valor=val;else ms.push({tipo:'Ferida',valor:val});p.marcadores=ms;p.ultFerida=null;sum+=`: Ferida rolada de novo (${uf.v} → ${nv}). Ferida agora ${val}.`}
    updSheet(id,p);await logRoll({kind:'brutal',who:sh.name||'Sem nome',label:'Habilidade: '+a.hab,dice:nv?[{v:nv}]:[],summary:sum});if(sh.arq!=='nerd')toast(a.hab+' usada.');break}
  case 'stab':{const b0=$('.stabs')?.getBoundingClientRect().top;S.stab[id]=v;render();const b1=$('.stabs')?.getBoundingClientRect().top;if(b0!=null&&b1!=null&&b0!==b1)window.scrollBy(0,b1-b0);break}
  case 'rstyle':S.roll[id].estilo=v;render();break;
  case 'ajstyle':S.roll[id].ajEst=v;render();break;
  case 'guideToggle':S.guide.open=!S.guide.open;render();if(S.guide.open)setTimeout(()=>$('#guide')?.focus?.(),0);break;
  case 'guideClose':S.guide.open=false;render();break;
  case 'guide':S.guide={open:true,tab:v||'agora',q:''};render();break;
  case 'guideTab':S.guide.tab=v;S.guide.q='';render();$('.g-body')&&($('.g-body').scrollTop=0);break;
  case 'incap':{const inc=new Set(sh.incap||[]);inc.has(v)?inc.delete(v):inc.add(v);updSheet(id,{incap:[...inc]});break}
  case 'apego':{const map={item:['itemUsado',2,'Item Icônico'],relacao:['relacaoUsada',2,'Relação Afetiva'],desejo:['desejoRevelado',3,'Desejo Obscuro']}[v];
    flush(id);updSheet(id,{pt:clamp((sh.pt||0)+map[1],0,10),apegos:{[map[0]]:true}});
    await logRoll({kind:'brutal',who:sh.name||'Sem nome',label:'Apego: '+map[2],dice:[],summary:`+${map[1]} PT`+(v==='desejo'&&sh.apegos?.desejo?` · "${sh.apegos.desejo.slice(0,140)}"`:'')});break}
  case 'vant':{const vt=[...VANT_G,...VANT_E].find(x=>x.k===v);let custo=vt.custo;if(custo==null)custo=+($('#vc-'+v)?.value||0);
    if((sh.pt||0)<custo)return toast(`Faltam PT: ${vt.n} custa ${custo}.`);
    const p={pt:(sh.pt||0)-custo};let note=vt.n;
    if(v==='choque'||v==='dor'||v==='tratar'){if((sh.pilha||0)>=6)return toast('A Pilha Comum já está cheia.');p.pilha=(sh.pilha||0)+1;if(v==='choque')updCamp({killer:{ph:(ck().ph||0)+1}})}
    if(v==='jeito'){const tid=$('#tj-'+id)?.value,tt=tid?getSheet(tid):null;if(!tt||!(tt.incap||[]).length)return toast('Ninguém com Estilo incapacitado.');const inc=tt.incap;if(tid===id)p.incap=inc.slice(1);else updSheet(tid,{incap:inc.slice(1)});note+=`: ${tid===id?'recuperou':tt.name+' recuperou'} ${inc[0]}`}
    if(v==='recursos')p.recursos=(sh.recursos||0)+1;
    if(v==='planejar'||v==='surpreender')p.flags={...(sh.flags||{}),[v]:true};
    if(v==='forcas'){const tid=$('#ft-'+id)?.value,tt=getSheet(tid);if(!tt)return toast('Escolha a Sobrevivente.');const give=Math.min(custo,10-(tt.pt||0));p.pt=(sh.pt||0)-give;updSheet(tid,{pt:(tt.pt||0)+give});note+=`: ${give} PT para ${tt.name}`}
    updSheet(id,p);await logRoll({kind:'brutal',who:sh.name||'Sem nome',label:'Vantagem',dice:[],summary:note+(v==='forcas'?'':` (−${custo} PT)`)});toast(vt.n+' usada.');break}
  case 'madd':updSheet(id,{marcadores:[...(sh.marcadores||[]),{tipo:v||'Ferida',valor:v==='Restrição'?3:v==='Ferida'?Math.max(1,sh.sequelas||0):1}]});break;
  case 'mstep':{const ms=[...sh.marcadores];const i=+t.dataset.i;const m=ms[i];const min=m.tipo==='Ferida'?Math.max(1,sh.sequelas||0):1;
    const nv=m.valor+(+t.dataset.d);if(nv<min&&m.tipo!=='Ferida'){ms.splice(i,1);toast(m.tipo+' removida.')}else ms[i]={...m,valor:clamp(nv,min,m.tipo==='Ferida'?99:6)};updSheet(id,{marcadores:ms});break}
  case 'mdel':{const ms=[...sh.marcadores];ms.splice(+t.dataset.i,1);updSheet(id,{marcadores:ms});break}
  case 'npcRoll':{const dice=Array.from({length:sh.pilha},()=>d(6));const ok=dice.filter(x=>x>=4).length;const res={dice:dice.map(v=>({v,ok:v>=4})),summary:`${ok} sucesso${ok!==1?'s':''} (4+)`,at:Date.now()};
    S.lastRes[id]=res;await logRoll({kind:'brutal',who:sh.name||'NPC',label:`${sh.pilha}d6`,...res});render();break}
  case 'logOpen':S.logOpen=true;S.seenRolls=S.rolls[0]?.at||0;ls.set('brutal.log','1');render();break;
  case 'logMin':S.logOpen=false;ls.set('brutal.log','0');render();break;
  case 'saveCrop':await saveCrop();break;
  }};
  if(MUT.has(act)&&S.view==='camp')await act_(label,run);else await run()});
const act_=(l,f)=>act(l,f);

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&S.guide?.open&&!S.modal){S.guide.open=false;render();return}
  if((e.key==='g'||e.key==='G')&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&(S.view==='camp'||S.view==='home')&&!(e.target.matches&&e.target.matches('input,textarea,select'))){e.preventDefault();S.guide.open=!S.guide.open;render();return}
  if(e.key==='Escape'&&S.modal){S.modal=null;S.crop=null;render();return}
  if(S.view!=='camp'||!(e.ctrlKey||e.metaKey))return;const k=e.key.toLowerCase();if(k!=='z'&&k!=='y')return;
  const t=e.target;const typing=t&&t.matches&&t.matches('textarea,input[type=text],input[type=password],input[type=number],input:not([type])');
  if(typing)return; /* dentro de um campo de texto vale o desfazer do próprio navegador */
  e.preventDefault();if(k==='y'||e.shiftKey)redo();else undo()});

document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;
  if(f.id==='authf')doAuth(f);
  if(f.id==='namef')saveName($('#nmi').value);
  if(f.id==='joinf')joinCamp($('#jc').value).catch(x=>{S.modal={t:'join',err:'Erro: '+(x.code||x.message)};render()});
  if(f.id==='createf')createCamp($('#cn').value).catch(x=>toast('Erro ao criar: '+(x.code||x.message)));
  if(f.id==='logf'){const q=$('#logq').value;const p=parseDice(q);if(!p)return toast('Use o formato NdL, ex.: 3d6 ou 1d20+2.');
    const sh=S.sheetId?getSheet(S.sheetId):null;act('Rolagem livre',()=>freeRoll(p.n,p.s,p.mod,(S.tab==='sheet'&&sh?.name)||S.acct?.name||S.u));$('#logq').value=''}});

document.addEventListener('focusin',e=>{const t=e.target;if(t.dataset?.sf&&S.sheetId){const s=getSheet(S.sheetId);S.editStart={id:S.sheetId,path:t.dataset.sf,val:getPath(s,t.dataset.sf)??''}}});
document.addEventListener('input',e=>{const t=e.target;
  if(t.dataset.guideq){S.guide.q=t.value;render();return}
  if(t.form&&['authf','joinf'].includes(t.form.id))S.fv[t.id]=t.value;
  if(t.dataset.sf&&S.sheetId){editField(S.sheetId,t.dataset.sf,t.value)}
  else if(t.dataset.wz){S.wiz.d[t.dataset.wz]=t.value}
  else if(t.dataset.free){S.free[t.dataset.free]=t.value;const b=$('[data-act=freeroll]');if(b)b.textContent=`Rolar ${S.free.n||1}d${S.free.s||6}`}
  else if(t.dataset.rw){S.rw[t.dataset.rw]=t.value}
  else if(t.id==='cz'&&S.crop){S.crop.zoom=+t.value;drawCrop()}
  else if(t.dataset.kf){clearTimeout(timers.k);const val=t.value;timers.k=setTimeout(()=>updCamp({killer:{[t.dataset.kf]:val}},true),600)}});

document.addEventListener('change',async e=>{const t=e.target;const act=t.dataset.act;
  if(t.dataset.rwsel){S.rw.sel[t.dataset.rwsel]=t.checked;render();return}
  if(t.dataset.ko){S.kopt[t.dataset.ko]=t.type==='checkbox'?t.checked:t.value;render();return}
  if(t.dataset.kc){const f=t.dataset.kc,val=t.value;return act_(f==='ameaca'?'Ameaça':'Apavoro',()=>{const p={[f]:val,preset:'custom'};if(f==='ameaca'){const ok=AMEACAS[val].acoes;p.acoes=kAcoes(ck()).filter(x=>ok.includes(x))}updCamp({killer:p})})}
  if(t.dataset.rf){const r=S.roll[t.dataset.id];r[t.dataset.rf]=t.type==='checkbox'?t.checked:t.value;render();return}
  if(act==='coverFile'){startCrop({k:'cover',code:t.dataset.v},t.files[0]);t.value='';return}
  if(act==='fotoFile'){startCrop(t.dataset.v==='wiz'?{k:'wiz'}:t.dataset.v==='killer'?{k:'killer'}:{k:'foto',id:t.dataset.id},t.files[0]);t.value='';return}
  if(t.dataset.sf&&S.sheetId){const st=S.editStart,id=S.sheetId,path=t.dataset.sf,nv=t.value;flush(id);
    if(st&&st.id===id&&st.path===path&&st.val!==nv)pushGroup('Editar '+(FIELD_LBL[path]||path),[{t:'upd',k:'s',id,inv:setPath({},path,st.val),fwd:setPath({},path,nv)}]);
    S.editStart={id,path,val:nv};render();return}
  const w=(l,f)=>act_(l,f);
  if(act==='owner')return w('Trocar jogador',()=>{updSheet(t.dataset.v,{owner:t.value||null});toast('Jogador atualizado.')});
  if(act==='status')return w('Situação',()=>updSheet(t.dataset.v,{status:t.value}));
  if(act==='arq'){const a=ARQ[t.value];return w('Arquétipo',()=>updSheet(t.dataset.id,{arq:t.value,estilos:a?[...a.e]:[],incap:[],tracos:a?a.tr:''}))}
  if(act==='mtype'){const sh=getSheet(t.dataset.id);const ms=[...sh.marcadores];ms[+t.dataset.i]={...ms[+t.dataset.i],tipo:t.value};return w('Tipo do marcador',()=>updSheet(t.dataset.id,{marcadores:ms}))}
  if(act==='kpreset'){if(t.value==='custom')return w('Assassino',()=>updCamp({killer:{preset:'custom'}}));const kp=KILLERS[t.value];return w('Trocar Assassino',()=>{updCamp({killer:{preset:t.value,...kp}});toast(kp.nome+' entrou em cena.')})}
  if(t.dataset.kf)updCamp({killer:{[t.dataset.kf]:t.value}},true)});

/* arrastar e dar zoom no recorte */
let drag=null;
document.addEventListener('pointerdown',e=>{if(e.target.id!=='cropcv'||!S.crop)return;drag={x:e.clientX,y:e.clientY,ox:S.crop.x,oy:S.crop.y};e.target.setPointerCapture(e.pointerId);e.target.parentNode.style.cursor='grabbing'});
document.addEventListener('pointermove',e=>{if(!drag)return;S.crop.x=drag.ox+(e.clientX-drag.x);S.crop.y=drag.oy+(e.clientY-drag.y);drawCrop()});
document.addEventListener('pointerup',()=>{if(drag){const w=$('#cropwrap');if(w)w.style.cursor=''}drag=null});
document.addEventListener('wheel',e=>{if(e.target.id!=='cropcv'||!S.crop)return;e.preventDefault();S.crop.zoom=clamp(S.crop.zoom*(e.deltaY<0?1.06:1/1.06),1,4);const z=$('#cz');if(z)z.value=S.crop.zoom;drawCrop()},{passive:false});
window.addEventListener('resize',()=>{if(S.modal?.t==='crop')drawCrop()});

/* ================= FIREBASE: FIRESTORE =================
   O app usa a mesma interface do banco anterior. A única diferença é o update:
   aqui um patch aninhado ({killer:{ph:2}}) vira caminhos com ponto ("killer.ph"),
   para mesclar em vez de substituir o mapa inteiro. */
function fsDB(fs){
  const flat=(o,pre='',out={})=>{for(const k in o){const v=o[k],key=pre+k;
    if(v&&typeof v==='object'&&!Array.isArray(v)&&Object.keys(v).length)flat(v,key+'.',out);else out[key]=v===undefined?null:v}return out};
  const wrapDoc=r=>({id:r.id,path:r.path,get:()=>r.get(),set:d=>r.set(d),update:d=>r.update(flat(d)),delete:()=>r.delete(),
    onSnapshot:(n,e)=>r.onSnapshot({includeMetadataChanges:false},n,e),collection:c=>wrapCol(r.collection(c)),acquire:async()=>({acquired:true})});
  const wrapCol=c=>({path:c.path,where:(...a)=>c.where(...a),orderBy:(...a)=>c.orderBy(...a),limit:n=>c.limit(n),get:()=>c.get(),
    onSnapshot:(n,e)=>c.onSnapshot(n,e),doc:id=>wrapDoc(id?c.doc(id):c.doc()),add:async d=>wrapDoc(await c.add(d))});
  return{doc:p=>wrapDoc(fs.doc(p)),collection:p=>wrapCol(fs.collection(p)),_flat:flat}}

/* ================= INÍCIO ================= */
(()=>{
  S.logOpen=ls.get('brutal.log')!=='0';
  if(!window.firebase){S.view='nofb';return render()}
  firebase.initializeApp(FB_CONFIG);
  const fs=firebase.firestore();try{fs.settings({ignoreUndefinedProperties:true})}catch(e){}
  S.db=fsDB(fs);AUTH=firebase.auth();AUTH.languageCode='pt';
  AUTH.onAuthStateChanged(u=>{
    if(u){S.u=u.uid;S.acct={name:u.displayName||S.pendingName||(u.email||'').split('@')[0]||'Jogador',email:u.email};S.fv={};S.authErr='';S.authInfo='';
      if(S.view==='login'||S.view==='boot'||S.view==='nofb')goHome();else render()}
    else{unsub();S.u=null;S.acct=null;S.code=null;S.camp=null;S.view='login';render()}});
})();
