<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Brutal VTT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Semi+Condensed:wght@500;600;700&family=Rubik+Wet+Paint&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap">
<style>
/* Layout: papel de fanzine slasher — blocos pretos de título, sangue como acento, painéis empilhados que viram 2 colunas no desktop */
:root{
  color-scheme:light;
  --paper:#EEE0D8; --paper-2:#E3CFC5; --card:#F6ECE6;
  --ink:#1B1416; --ink-2:#56464A; --line:rgba(27,20,22,.2);
  --blood:#C10F2C; --blood-2:#8E0A20; --on-blood:#FFF4F0;
  --block:#1F1719; --bone:#F3E7E0;
  --ok:#17703F; --ok-bg:#D7EADD; --bad-bg:#F3D3D6;
  --shadow:0 2px 0 rgba(27,20,22,.25);
  --f-logo:"Rubik Wet Paint","Impact",fantasy;
  --f-head:"Anton","Impact","Arial Narrow",sans-serif;
  --f-ui:"Barlow Semi Condensed","Arial Narrow","Helvetica Neue",sans-serif;
  --f-body:"Source Serif 4",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#130B0D; --paper-2:#1E1215; --card:#1A1013;
  --ink:#F2E5DE; --ink-2:#BCA7A2; --line:rgba(242,229,222,.18);
  --blood:#E8364F; --blood-2:#FF6A7E; --on-blood:#fff;
  --block:#060304; --bone:#F3E7E0;
  --ok:#5FD08D; --ok-bg:#163522; --bad-bg:#3D1219;
  --shadow:0 2px 0 rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#130B0D; --paper-2:#1E1215; --card:#1A1013;
  --ink:#F2E5DE; --ink-2:#BCA7A2; --line:rgba(242,229,222,.18);
  --blood:#E8364F; --blood-2:#FF6A7E; --on-blood:#fff;
  --block:#060304; --bone:#F3E7E0;
  --ok:#5FD08D; --ok-bg:#163522; --bad-bg:#3D1219;
  --shadow:0 2px 0 rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html,body{min-height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
#app{max-width:1240px;margin:0 auto}
h1,h2,h3{text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blood);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Type */
.logo{font-family:var(--f-logo);color:var(--blood);font-size:clamp(64px,13vw,128px);line-height:.95;letter-spacing:.02em}
.logo.sm{font-size:40px}
.blk{display:inline-block;background:var(--block);color:var(--bone);font-family:var(--f-head);font-weight:400;
  text-transform:uppercase;letter-spacing:.01em;padding:4px 12px 2px;font-size:28px;line-height:1.1}
.blk.red{background:var(--blood);color:var(--on-blood)}
.label{font-family:var(--f-ui);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:15px;color:var(--ink-2)}
.muted{color:var(--ink-2)}
.ui{font-family:var(--f-ui)}
.num{font-variant-numeric:tabular-nums;font-family:var(--f-ui);font-weight:700}

/* Controls */
.btn{font-family:var(--f-ui);font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:17px;
  border:2px solid var(--ink);background:transparent;padding:10px 18px;cursor:pointer;line-height:1.1;min-height:48px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn:hover{background:var(--paper-2)}
.btn.pri{background:var(--blood);border-color:var(--blood);color:var(--on-blood)}
.btn.pri:hover{background:var(--blood-2);border-color:var(--blood-2)}
.btn.dark{background:var(--block);border-color:var(--block);color:var(--bone)}
.btn.sm{min-height:38px;padding:6px 12px;font-size:15px}
.btn.ghost{border-color:transparent}
.btn.danger{border-color:var(--blood);color:var(--blood)}
.btn:disabled{opacity:.45;cursor:not-allowed}
input[type=text],input[type=password],input[type=number],select,textarea{
  width:100%;background:var(--card);border:2px solid var(--line);padding:10px 12px;font-size:18px;min-height:48px;border-radius:0}
input:focus,select:focus,textarea:focus{border-color:var(--blood);outline:none}
textarea{min-height:96px;resize:vertical;font-family:var(--f-body)}
.field{display:grid;gap:6px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.grow{flex:1 1 200px;min-width:0}
.stack{display:grid;gap:16px}
.err{background:var(--bad-bg);border-left:4px solid var(--blood);padding:10px 14px;font-family:var(--f-ui);font-weight:600}

/* Top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:16px;border-bottom:3px solid var(--ink);margin-bottom:24px}
.who{font-family:var(--f-ui);font-weight:600;font-size:17px}
.linkish{background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px;color:inherit}

/* Login */
.login{min-height:88vh;display:grid;place-items:center;padding-block:24px}
.login-in{width:min(460px,100%);display:grid;gap:20px}
.login .tag{font-family:var(--f-ui);font-weight:700;text-transform:uppercase;letter-spacing:.14em;font-size:16px}
.panel{background:var(--card);border:2px solid var(--ink);box-shadow:var(--shadow);padding:20px;display:grid;gap:16px;min-width:0}
.tabs{display:flex;flex-wrap:wrap;gap:0;border-bottom:3px solid var(--ink)}
.tab{font-family:var(--f-head);text-transform:uppercase;font-size:22px;padding:8px 18px 6px;border:0;background:transparent;cursor:pointer;color:var(--ink-2)}
.tab[aria-selected=true]{background:var(--block);color:var(--bone)}
.tab .ct{font-family:var(--f-ui);font-size:15px;opacity:.75;margin-left:4px}

/* Home */
.hero-acts{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:20px;margin-top:20px}
.ccard{background:var(--card);border:2px solid var(--ink);box-shadow:var(--shadow);display:grid;min-width:0}
.cover{aspect-ratio:16/9;max-width:100%;width:100%;background:
  repeating-linear-gradient(135deg,var(--paper-2) 0 14px,var(--card) 14px 28px);display:grid;place-items:center;overflow:hidden;position:relative}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover .ph{font-family:var(--f-logo);color:var(--blood);font-size:44px;opacity:.6}
.ccard .body{padding:14px 16px 16px;display:grid;gap:10px}
.ccard h3{font-family:var(--f-head);font-weight:400;font-size:26px;text-transform:uppercase;line-height:1.1}
.code{font-family:var(--f-ui);font-weight:700;letter-spacing:.18em;font-size:20px}
.empty{border:2px dashed var(--line);padding:32px;text-align:center;display:grid;gap:10px;justify-items:center;margin-top:20px}

/* Campaign */
.banner{position:relative;border:2px solid var(--ink);margin-bottom:20px;overflow:hidden;background:var(--block)}
.banner .cover{aspect-ratio:auto;height:clamp(150px,24vw,280px)}
.banner .ttl{position:absolute;left:0;bottom:0;right:0;padding:14px 18px;background:linear-gradient(transparent,rgba(6,3,4,.88));color:#F3E7E0}
.banner .ttl h1{font-family:var(--f-head);font-weight:400;text-transform:uppercase;font-size:clamp(30px,5vw,52px);line-height:1}
.ctabs{margin-bottom:22px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:20px;align-items:start}
.sec{display:grid;gap:14px;min-width:0}
.sec > .blk{justify-self:start}
.list{display:grid;gap:0;border-top:2px solid var(--ink)}
.li{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 4px;border-bottom:1px solid var(--line)}
.li .nm{font-family:var(--f-head);text-transform:uppercase;font-size:22px;font-weight:400;flex:1 1 160px;min-width:0;line-height:1.1}
.chip{display:inline-block;font-family:var(--f-ui);font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:14px;padding:3px 9px;color:#fff;background:var(--ink-2)}
.chip.out{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.chip.inc{background:transparent;color:var(--ink-2);border:1.5px dashed var(--ink-2);text-decoration:line-through}
.state{font-family:var(--f-ui);font-weight:700;text-transform:uppercase;font-size:14px;padding:3px 8px;border:2px solid currentColor}
.state.morta{color:var(--blood)} .state.escapou{color:var(--ok)}

/* Dice */
.dice{display:flex;flex-wrap:wrap;gap:8px}
.die{width:48px;height:48px;display:grid;place-items:center;font-family:var(--f-head);font-size:26px;border:2.5px solid var(--ink);background:var(--card);border-radius:8px;line-height:1}
.die.ok{background:var(--blood);border-color:var(--blood);color:var(--on-blood)}
.die.no{opacity:.55;border-style:dashed}
.die.sm{width:34px;height:34px;font-size:18px;border-width:2px;border-radius:6px}
.slots{display:flex;flex-wrap:wrap;gap:8px}
.slot{width:46px;height:46px;border:2.5px dashed var(--ink-2);border-radius:8px;background:transparent;cursor:pointer;padding:0;display:grid;place-items:center}
.slot.on{border-style:solid;border-color:var(--ink);background:var(--block)}
.slot.on::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--blood)}
.slot.fuga.on{background:var(--ok);border-color:var(--ok)}
.slot.fuga.on::after{background:#fff}
.slot:disabled{cursor:default}
.pips{display:flex;flex-wrap:wrap;gap:6px}
.pip{width:30px;height:30px;border:2px solid var(--ink);border-radius:50%;background:transparent;cursor:pointer;padding:0}
.pip.on{background:var(--blood);border-color:var(--blood)}
.stepper{display:inline-flex;align-items:center;border:2px solid var(--ink)}
.stepper button{width:44px;height:44px;border:0;background:transparent;font-size:22px;font-family:var(--f-ui);font-weight:700;cursor:pointer}
.stepper button:hover{background:var(--paper-2)}
.stepper .v{min-width:48px;text-align:center;font-family:var(--f-head);font-size:24px}
.result{border:2px solid var(--ink);padding:14px;display:grid;gap:10px;background:var(--card)}
.result.win{border-color:var(--ok);background:var(--ok-bg)}
.result.lose{border-color:var(--blood);background:var(--bad-bg)}
.result .big{font-family:var(--f-head);text-transform:uppercase;font-size:28px;line-height:1}

/* Sheet */
.sheet-head{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.name-in{font-family:var(--f-head)!important;font-size:clamp(30px,5vw,46px)!important;text-transform:uppercase;border:0!important;border-bottom:3px solid var(--ink)!important;background:transparent!important;padding:4px 0!important;min-height:0!important}
.arq-band{padding:14px 16px;color:#fff;display:grid;gap:6px}
.arq-band .t{font-family:var(--f-head);font-size:32px;text-transform:uppercase;line-height:1}
.arq-band .s{font-family:var(--f-ui);font-weight:600;text-transform:uppercase;letter-spacing:.05em;font-size:15px}
.hab{border:2px solid var(--ink);padding:12px 14px;display:grid;gap:4px}
.hab .n{font-family:var(--f-head);text-transform:uppercase;font-size:22px;line-height:1.1}
.box{border:2px solid var(--ink);padding:16px;display:grid;gap:14px;background:var(--card);min-width:0}
.box > h3{font-family:var(--f-head);font-weight:400;text-transform:uppercase;font-size:24px;line-height:1}
.kv{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.mark{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:8px}
.vant{border-top:1px solid var(--line);padding-top:10px;display:grid;gap:4px}
.vant .n{font-family:var(--f-ui);font-weight:700;text-transform:uppercase;font-size:17px}
.vant .meta{font-family:var(--f-ui);font-size:15px;color:var(--ink-2)}
.seg{display:inline-flex;flex-wrap:wrap;border:2px solid var(--ink)}
.seg button{border:0;background:transparent;padding:8px 12px;font-family:var(--f-ui);font-weight:700;text-transform:uppercase;font-size:15px;cursor:pointer;min-height:42px}
.seg button[aria-pressed=true]{background:var(--block);color:var(--bone)}
.flag{font-family:var(--f-ui);font-weight:700;background:var(--block);color:var(--bone);padding:8px 12px;font-size:16px}
.flag.red{background:var(--blood);color:var(--on-blood)}
.arqgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.arqcard{border:3px solid transparent;padding:0;text-align:left;background:var(--card);cursor:pointer;display:grid}
.arqcard[aria-pressed=true]{border-color:var(--ink);box-shadow:0 0 0 3px var(--blood)}
.arqcard .b{padding:10px 12px;display:grid;gap:4px;font-size:16px}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps span{font-family:var(--f-ui);font-weight:700;text-transform:uppercase;font-size:14px;padding:4px 10px;border:2px solid var(--line);color:var(--ink-2)}
.steps span.on{border-color:var(--ink);color:var(--ink);background:var(--paper-2)}
table.t{width:100%;border-collapse:collapse;font-family:var(--f-ui);font-size:16px}
table.t td,table.t th{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
table.t th{font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:14px;color:var(--ink-2)}
.tw{overflow-x:auto}
.check{display:flex;gap:10px;align-items:center;font-family:var(--f-ui);font-weight:600;font-size:17px;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--blood)}

/* Log bubble */
.log{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40}
.log-min{width:72px;height:72px;background:var(--block);color:var(--bone);border:3px solid var(--blood);cursor:pointer;display:grid;place-items:center;position:relative;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.log-min .badge{position:absolute;top:-10px;right:-10px;background:var(--blood);color:#fff;font-family:var(--f-ui);font-weight:700;font-size:14px;min-width:26px;height:26px;display:grid;place-items:center;padding:0 6px}
.log-box{width:min(380px,calc(100vw - 32px));height:min(540px,70vh);background:var(--card);border:3px solid var(--ink);display:grid;grid-template-rows:auto 1fr auto;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.log-hd{background:var(--block);color:var(--bone);display:flex;align-items:center;justify-content:space-between;padding:8px 10px 8px 14px}
.log-hd b{font-family:var(--f-head);font-weight:400;text-transform:uppercase;font-size:22px}
.log-hd button{background:transparent;border:2px solid var(--bone);color:var(--bone);width:38px;height:38px;cursor:pointer;font-size:20px}
.log-ls{overflow-y:auto;padding:4px 12px}
.entry{padding:10px 0;border-bottom:1px solid var(--line);display:grid;gap:6px}
.entry .h{display:flex;justify-content:space-between;gap:8px;font-family:var(--f-ui);font-size:15px}
.entry .h b{font-size:17px}
.entry .s{font-family:var(--f-ui);font-size:16px;font-weight:600}
.log-ft{border-top:2px solid var(--ink);padding:10px;display:flex;gap:8px}

/* Modal + toast */
.scrim{position:fixed;inset:0;background:rgba(10,4,6,.7);z-index:60;display:grid;place-items:center;padding:16px}
.modal{background:var(--card);border:3px solid var(--ink);width:min(560px,100%);max-height:90vh;overflow:auto;padding:22px;display:grid;gap:16px}
.modal.wide{width:min(820px,100%)}
.modal h2{font-family:var(--f-head);font-weight:400;text-transform:uppercase;font-size:30px;line-height:1}
.crop-wrap{width:100%;aspect-ratio:16/9;max-width:100%;background:#000;touch-action:none;cursor:grab;border:2px solid var(--ink)}
.crop-wrap canvas{width:100%;height:100%;display:block}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--block);color:var(--bone);font-family:var(--f-ui);font-weight:600;font-size:17px;padding:12px 18px;z-index:80;border-left:5px solid var(--blood);max-width:calc(100vw - 32px)}
.center{min-height:60vh;display:grid;place-items:center;text-align:center}
/* Guia de jogo */
.top{padding-right:104px}
.guide-btn{position:fixed;z-index:70;top:calc(12px + env(safe-area-inset-top,0px));right:calc(max(16px,env(safe-area-inset-right,0px)));display:inline-flex;align-items:center;gap:8px;
  background:var(--block);color:var(--bone);border:2px solid var(--block);font-family:var(--f-ui);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:16px;padding:9px 14px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.guide-btn:hover,.guide-btn[aria-expanded=true]{background:var(--blood);border-color:var(--blood);color:var(--on-blood)}
.g-scrim{position:fixed;inset:0;background:rgba(10,4,6,.45);z-index:65}
.guide{position:fixed;z-index:66;top:0;right:0;bottom:0;width:min(480px,100vw);background:var(--card);color:var(--ink);border-left:4px solid var(--ink);display:grid;grid-template-rows:auto auto auto 1fr;gap:12px;
  padding:calc(64px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) 18px;box-shadow:-10px 0 30px rgba(0,0,0,.35)}
.g-top{display:flex;justify-content:space-between;align-items:center;gap:10px;position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:18px;right:140px}
.g-top b{font-family:var(--f-head);font-weight:400;text-transform:uppercase;font-size:28px;line-height:1}

.g-tabs{display:flex;flex-wrap:wrap;gap:6px}
.g-tabs button{font-family:var(--f-ui);font-weight:700;text-transform:uppercase;font-size:14px;letter-spacing:.04em;padding:6px 10px;border:2px solid var(--line);background:transparent;cursor:pointer;color:var(--ink-2)}
.g-tabs button[aria-pressed=true]{background:var(--block);color:var(--bone);border-color:var(--block)}
.g-body{overflow-y:auto;display:grid;gap:10px;align-content:start;padding-right:4px;min-height:0}
.g-lead{margin:0;font-family:var(--f-ui);font-weight:600;color:var(--ink-2)}
.g-it{border-top:2px solid var(--line);padding-top:10px;display:grid;gap:4px}
.g-h{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;justify-content:space-between}
.g-h b{font-family:var(--f-ui);font-weight:700;text-transform:uppercase;letter-spacing:.03em;font-size:17px}
.g-tag{font-family:var(--f-ui);font-weight:700;font-size:13px;text-transform:uppercase;color:var(--blood);letter-spacing:.04em}
.g-it p{margin:0;font-size:16.5px;line-height:1.5}
.qmark{width:30px;height:30px;border-radius:50%;border:2px solid currentColor;background:transparent;font-family:var(--f-ui);font-weight:700;font-size:17px;cursor:pointer;color:var(--ink-2);flex:0 0 auto;line-height:1;padding:0}
.qmark:hover{color:var(--blood)}
.kill .qmark{color:var(--k-ink)}
.bh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.bh h3{font-family:var(--f-head);font-weight:400;text-transform:uppercase;font-size:24px;line-height:1;margin:0}
/* Ficha do jogador */
.now{border:3px solid var(--ink);padding:14px 16px;display:grid;gap:8px;margin-bottom:14px;background:var(--card)}
.now-t{display:flex;justify-content:space-between;align-items:center;gap:10px}
.now-t b{font-family:var(--f-head);font-weight:400;text-transform:uppercase;font-size:clamp(24px,4vw,32px);line-height:1.05}
.now p{margin:0;font-size:18px;max-width:72ch}
.now.red{background:var(--blood);border-color:var(--blood);color:var(--on-blood)}.now.red .qmark{color:var(--on-blood)}
.now.red .btn.pri{background:var(--on-blood);color:var(--blood);border-color:var(--on-blood);justify-self:start}
.now.dark{background:var(--block);border-color:var(--block);color:var(--bone)}.now.dark .qmark{color:var(--bone)}
.now.warn{border-color:var(--blood);border-left-width:10px}
.now.ok{background:var(--ok-bg);border-color:var(--ok)}
.now.dead{opacity:.8;border-style:dashed}
.sbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;background:var(--paper);border-bottom:3px solid var(--ink);padding:8px 104px 8px 0;margin-bottom:16px}

/* ================= DESFAZER / REFAZER =================
   Cada ação do usuário vira um grupo com as operações inversas. Ctrl+Z desfaz o grupo inteiro
   (ex.: uma rolagem que mexeu na ficha, na Pilha da Diretora e no log). */
function invert(cur,patch){const inv={};for(const k in patch){const v=patch[k],c=cur?cur[k]:undefined;
  if(v&&typeof v==='object'&&!Array.isArray(v)&&c&&typeof c==='object'&&!Array.isArray(c))inv[k]=invert(c,v);else inv[k]=c===undefined?null:clone(c)}return inv}

let rq=0;function scheduleRender(){if(rq)return;rq=requestAnimationFrame(()=>{rq=0;render()})}
function localApply(k,id,p){if(k==='camp'){if(S.camp)S.camp=deepMerge(S.camp,p)}else{const i=S.sheets.findIndex(x=>x.id===id);if(i>=0)S.sheets[i]=deepMerge(S.sheets[i],p)}}

function updCamp(p,raw){if(!S.camp)return Promise.resolve();if(!raw)rec({t:'upd',k:'camp',inv:invert(S.camp,p),fwd:clone(p)});
  localApply('camp',null,p);scheduleRender();return queue('camp',()=>campRef().update(p))}

  if(op.t==='upd'){const p=u?op.inv:op.fwd;return op.k==='camp'?updCamp(p,true):updSheet(op.id,p,true)}
  const ref=S.db.doc(op.path);
  if(op.t==='set'){const v=u?op.prev:op.next;return v==null?ref.delete():ref.set(v)}
  if(op.t==='updp')return ref.update(u?op.inv:op.fwd);
  if(op.t==='mark')return ref.update({undone:u})}

/* imagens: data URL -> blob URL em cache, para não redecodificar a cada atualização */
const _imgc=new Map();
function imgURL(du){if(!du)return '';let u=_imgc.get(du);if(u)return u;
  try{const i=du.indexOf(',');const mime=du.slice(5,du.indexOf(';'));const bin=atob(du.slice(i+1));const arr=new Uint8Array(bin.length);for(let j=0;j<bin.length;j++)arr[j]=bin.charCodeAt(j);
    u=URL.createObjectURL(new Blob([arr],{type:mime}))}catch(e){u=du}
  if(_imgc.size>80){for(const [k,v] of _imgc){if(v.startsWith('blob:'))URL.revokeObjectURL(v);_imgc.delete(k);break}}
  _imgc.set(du,u);return u}

  const temE=o.estilo&&(sh.estilos||[]).includes(o.estilo)&&!(sh.incap||[]).includes(o.estilo);
  const diff=clamp(4-(temE?1:0)-(o.recurso?1:0),2,6);
  let n=o.n;if(o.act==='susto')n=1;
  if(o.act==='vazar'&&marks.some(m=>m.tipo==='Segurada'))return toast('Segurada: ela não consegue mover dados para a Fuga. Uma aliada precisa libertá-la.');
  if(n<1||n>(sh.pilha||0))return toast(sh.pilha?'Escolha entre 1 e '+sh.pilha+' dados da Pilha Comum.':'A Pilha Comum está vazia. Recupere fôlego ou use uma Vantagem.');
  let dice=Array.from({length:n},()=>d(6));
  let note=[];
  if(o.act==='susto'&&dice[0]<diff&&sh.arq==='cetica'){const r=d(6);note.push(`Benefício da Dúvida: ${dice[0]} → ${r}`);dice=[r]}
  const okv=dice.map(v=>v>=diff);let succ=okv.filter(Boolean).length;
  if(o.act==='partir'&&sh.flags?.surpreender){succ+=1;note.push('Surpreender: +1 sucesso garantido')}
  const fails=n-okv.filter(Boolean).length,sixes=dice.filter(v=>v===6).length,need=complexo?2:1,win=succ>=need;
  const sp={},cp={},kp={};let pilha=sh.pilha,fuga=sh.fuga||0,descarte=camp.descarte||0,kpilha=k.pilha||0,kph=k.ph||0;
  const perdeFalhas=o.act!=='ajudar';
  if(perdeFalhas&&fails){pilha-=fails;
    if(enc||o.act==='susto'){descarte+=fails;note.push(`${fails} dado${fails>1?'s':''} descartado${fails>1?'s':''}`)}
    else{kpilha+=fails;note.push(`${fails} dado${fails>1?'s':''} sacrificado${fails>1?'s':''} à Diretora`)}}
  if(o.act==='susto'){if(fails){kph+=1;if(k.ameaca==='Assombração')kph+=1;note.push('Assassino ganha PH');cp.sustoFalhas=[...new Set([...(camp.sustoFalhas||[]),id])]}
    const al=camp.pedido?.alvos||[];if(al.includes(id))cp.pedido={alvos:al.filter(x=>x!==id)}}
  if(o.act==='vazar'){const real=okv.filter(Boolean).length;pilha-=real;fuga+=real;
    for(let i=0;i<sixes;i++){if(pilha>0){pilha--;fuga++}else if(descarte>0){descarte--;fuga++}}
    if(real)note.push(`${real} dado${real>1?'s':''} para a Pilha de Fuga${sixes?` · ${sixes} fuga vantajosa`:''}`);
    const alvo=k.fugaAlvo||6;if(fuga>=alvo){fuga=alvo;sp.status='escapou';note.push('ESCAPOU DO ENCONTRO')}sp.fuga=fuga}
  if(o.act==='partir'){if(win&&kpilha>0){kpilha--;descarte++;note.push('Diretora descarta 1 dado')}
    if(sh.flags?.surpreender)sp.flags={...sh.flags,surpreender:false};
    if(!win&&k.ameaca==='Brutamontes'){kph+=2;note.push('Brutamontes ganha 2 PH')}}
  if(o.act==='distrair'&&win){cp.distrair=(camp.distrair||0)+1;note.push('MATAR custa +1 dado e +3 PH à Diretora')}
  if(o.act==='ajudar'&&o.alvo){const t=getSheet(o.alvo);if(t){const give=Math.min(succ,6-(t.pilha||0));
      if(give>0){pilha-=give;updSheet(o.alvo,{pilha:(t.pilha||0)+give});note.push(`${give} dado${give>1?'s':''} doado${give>1?'s':''} a ${t.name||'aliada'}`)}}}
  let ms=marks.map(m=>({...m})),msCh=false;
  const pos=ms.findIndex(m=>m.tipo==='Possessão');
  if(pos>=0&&fails){ms[pos].valor=clamp(ms[pos].valor+fails,1,6);msCh=true;note.push(`Possessão sobe para ${ms[pos].valor}`+(ms[pos].valor>=6?': o Assassino pode MATAR através dela':''))}
  if(o.act==='restr'){const ri=ms.findIndex(m=>m.tipo==='Restrição');if(ri>=0){const real=okv.filter(Boolean).length;msCh=true;
    if(real){ms[ri].valor-=real;note.push(`Restrição −${real}`);if(ms[ri].valor<=0){ms.splice(ri,1);note.push('Restrição removida')}}
    else{ms[ri].valor=Math.min(6,ms[ri].valor+1);const val=ms[ri].valor;const fi=ms.findIndex(m=>m.tipo==='Ferida');
      if(fi>=0)ms[fi].valor+=val;else ms.push({tipo:'Ferida',valor:Math.max(val,sh.sequelas||0)});note.push(`Restrição sobe para ${val} e causa ${val} de Ferida`)}}}
  if(msCh)sp.marcadores=ms;
  if(o.act==='libertar'&&win&&o.alvo){const tl=getSheet(o.alvo);if(tl){updSheet(o.alvo,{marcadores:(tl.marcadores||[]).filter(m=>m.tipo!=='Segurada')});note.push(`${tl.name||'Aliada'} foi libertada`)}}
  if(sixes&&kAcoes(k).includes('devorar')){kph+=1;note.push('Devorar: Assassino +1 PH')}
  if(sh.arq==='esbelta'&&sixes){sp.pt=clamp((sh.pt||0)+sixes,0,10);note.push(`Egocêntrica: +${sixes} PT`)}
  if(o.recurso){sp.recursos=Math.max(0,(sh.recursos||0)-1)}
  sp.pilha=clamp(pilha,0,6);
  if(kpilha!==k.pilha)kp.pilha=Math.max(0,kpilha);if(kph!==k.ph)kp.ph=kph;
  if(descarte!==camp.descarte)cp.descarte=Math.max(0,descarte);
  if(Object.keys(kp).length)cp.killer=kp;
  updSheet(id,sp);if(Object.keys(cp).length)updCamp(cp);
  const label={teste:'Arriscar',susto:'Teste de Susto',vazar:'Vazar Dali',partir:'Partir Para Cima',distrair:'Distrair',ajudar:'Ajudar Alguém',libertar:'Libertar aliada',restr:'Reduzir Restrição'}[o.act]
    +(o.estilo&&o.act!=='susto'?' · '+o.estilo:'')+(complexo?' · Complexo':'');
  const res={kind:'brutal',who:sh.name||'Sem nome',label,sides:6,dice:dice.map((v,i)=>({v,ok:okv[i]})),win,
    summary:`${succ} sucesso${succ!==1?'s':''} de ${need} · ${win?'SUCESSO':'FALHA'} (${diff}+)`,note:note.join(' · '),cena:CENAS[cena]};
  S.lastRes[id]={...res,at:Date.now()};
  if(['vazar','partir','distrair','ajudar','libertar','restr'].includes(o.act))afterTurn(id);
  await logRoll(res);render()}

/* ================= AÇÕES DO MESTRE ================= */
async function killerAct(kind,tid,o={}){const c=S.camp,k=ck(),t=getSheet(tid);const enc=c.cena==='encontro';const kt=enc&&c.turno?.id==='killer';
  if(!t)return toast('Escolha uma Sobrevivente como alvo.');
  let ph=k.ph||0,pil=k.pilha||0;const cp={};let note='',lbl='',dice=[],win=null;
  if(kind==='ferir'){
    if(o.acidentar){if(enc)return toast('Acidentar só vale fora de um Encontro.');if(!(c.sustoFalhas||[]).includes(tid))return toast('Acidentar só atinge quem falhou no último Teste de Susto.')}
    else if(!enc)return toast('FERIR acontece durante um Encontro. Fora dele, use Acidentar.');
    const custo=(o.acidentar?4:0)+(o.incap?4:0)+(o.segurar?5:0);
    if(pil<1)return toast('O Assassino não tem dados na Pilha.');if(ph<custo)return toast(`Faltam ${custo-ph} PH para este ataque.`);
    ph-=custo;const v=d(6);dice=[{v,ok:v===6}];win=v===6;pil-=1;cp.descarte=(c.descarte||0)+1;
    const seq0=t.sequelas||0;const p={sequelas:seq0+1};const ms=[...(t.marcadores||[])];
    if(v===6){ph+=(o.incap?4:0)+(o.segurar?5:0);
      if(o.mutilar){p.sequelas=seq0+4;ph+=4;note='Mutilada: viva, +3 Sequelas extras e uma última chance de correr. +4 PH.'}
      else{p.status='morta';note='Morta instantaneamente.';if(enc){ph+=1;cp.mortesEnc=(c.mortesEnc||0)+1}}}
    else{const i=ms.findIndex(m=>m.tipo==='Ferida');p.ultFerida={v,antes:i>=0?ms[i].valor:0,at:Date.now()};
      if(i>=0){ms[i]={...ms[i],valor:Math.max(ms[i].valor+v,p.sequelas)};note=`Ferida somada: ${ms[i].valor}.`}
      else{ms.push({tipo:'Ferida',valor:Math.max(v,p.sequelas)});note=`Ferida ${Math.max(v,p.sequelas)}.`}
      if(o.incap&&o.incapStyle){p.incap=[...new Set([...(t.incap||[]),o.incapStyle])];note+=` ${o.incapStyle} incapacitado.`}
      if(o.segurar&&!ms.some(m=>m.tipo==='Segurada')){ms.push({tipo:'Segurada',valor:1});note+=' Segurada: não pode fugir.'}
      p.marcadores=ms}
    if(k.ameaca==='Mestre'&&seq0===0&&p.status!=='morta'){ph+=1;note+=' Mestre: +1 PH (primeira Sequela).'}
    updSheet(tid,p);note+=' +1 Sequela.';lbl=(o.acidentar?'ACIDENTAR':'FERIR')+' → '+(t.name||'?')}
  if(kind==='matar'){const extra=c.distrair||0;
    if(o.via){const ps=getSheet(o.via);if(!ps||!(ps.marcadores||[]).some(m=>m.tipo==='Possessão'&&m.valor>=6))return toast('A Possessão precisa estar em 6.');
      if(ps.id!==tid)updSheet(ps.id,{marcadores:(ps.marcadores||[]).filter(m=>m.tipo!=='Possessão')});note=`Pelas mãos de ${ps.name||'uma possuída'}. `}
    else{if(!enc)return toast('MATAR só acontece num Encontro, ou através de uma possuída.');
      if((t.pilha||0)>=pil)return toast('Só dá para MATAR quem tem menos dados que o Assassino.');
      if(pil<extra||ph<3*extra)return toast(`Distrair encareceu o MATAR: ${extra} dado(s) e ${3*extra} PH.`);
      pil-=extra;ph-=3*extra;if(extra){cp.distrair=0;note=`Distração custou ${extra} dado(s) e ${3*extra} PH. `}}
    updSheet(tid,{status:'morta',...(o.via===tid?{marcadores:(t.marcadores||[]).filter(m=>m.tipo!=='Possessão')}:{})});
    if(enc){ph+=1;cp.mortesEnc=(c.mortesEnc||0)+1}note+=`${t.name||'A Sobrevivente'} foi morta.`;lbl='MATAR → '+(t.name||'?')}
  if(kind==='possuir'){if(!enc)return toast('Possuir acontece num Encontro.');
    const ms=(t.marcadores||[]).filter(m=>m.tipo!=='Possessão');ms.push({tipo:'Possessão',valor:1});updSheet(tid,{marcadores:ms});
    note='Possessão 1. Sobe a cada dado falho dela.';lbl='POSSUIR → '+(t.name||'?')}
  if(kind==='restringir'){if(!enc)return toast('Restringir acontece num Encontro.');
    const ms=(t.marcadores||[]).filter(m=>m.tipo!=='Restrição');ms.push({tipo:'Restrição',valor:3});updSheet(tid,{marcadores:ms});
    note='Restrição 3: todos os testes dela viram Complexos.';lbl='RESTRINGIR → '+(t.name||'?')}
  const kp={};if(pil!==(k.pilha||0))kp.pilha=Math.max(0,pil);if(ph!==(k.ph||0))kp.ph=Math.max(0,ph);if(Object.keys(kp).length)cp.killer=kp;
  if(Object.keys(cp).length)updCamp(cp);
  if(kt)nextTurn();
  await logRoll({kind:'brutal',who:k.nome||'Assassino',label:lbl,sides:6,dice,win,summary:note})}

async function kDo(kind,arg){const c=S.camp,k=ck(),enc=c.cena==='encontro';let ph=k.ph||0;const who=k.nome||'Assassino';
  const pay=x=>{if(ph<x){toast(`Faltam ${x-ph} PH.`);return false}ph-=x;return true};
  if(kind==='escapar'){if(!enc)return toast('Escapar só vale durante um Encontro.');await setCena('livre');updCamp({killer:{pilha:(ck().pilha||0)+1}});
    return logRoll({kind:'brutal',who,label:'ESCAPAR',dice:[],summary:'O Assassino se retira: Encontro encerrado e +1 dado na Pilha.'})}
  if(kind==='dificultar'){if(!enc)return toast('Dificultar vale no início de um Encontro.');const fa=k.fugaAlvo||6;if(fa>=6)return toast('A Pilha de Fuga já exige o máximo (6).');if(!pay(4))return;
    updCamp({killer:{ph,fugaAlvo:fa+1}});return logRoll({kind:'brutal',who,label:'DIFICULTAR',dice:[],summary:`Obstáculos no caminho: a Pilha de Fuga agora exige ${fa+1} dados.`})}
  if(kind==='buh'){if(!enc)return toast('Buh! vale no início de um Encontro.');if(!pay(4))return;updCamp({killer:{ph}});return pedirSusto(true,'BUH!')}
  if(kind==='sangue'){const custo=2*nInterp();if(!enc||!(c.mortesEnc>0))return toast('Só depois da primeira morte neste Encontro.');if(c.sangueUsado)return toast('Já usado neste Encontro.');if(!pay(custo))return;
    const viv=S.sheets.filter(s=>s.kind==='pc'&&s.status==='viva'&&(s.pilha||0)>0);viv.forEach(s=>updSheet(s.id,{pilha:s.pilha-1}));
    updCamp({killer:{ph},sangueUsado:true,descarte:(c.descarte||0)+viv.length});
    return logRoll({kind:'brutal',who,label:'SINTO CHEIRO DE SANGUE!',dice:[],summary:`${viv.length} Sobrevivente(s) descartam 1 dado. Custo ${custo} PH.`})}
  if(kind==='hora'){if(!enc)return toast('Sua Hora Chegou! vale no início de um Encontro.');if(!arg)return toast('Escolha um Dado Marcador.');
    const [sid,i]=arg.split(':');const s=getSheet(sid);if(!s)return;const ms=[...(s.marcadores||[])];const m=ms[+i];if(!m||m.tipo==='Ferida')return toast('Escolha um marcador que não seja Ferida.');
    if(!pay(3))return;ms[+i]={...m,valor:Math.min(6,m.valor+1)};updSheet(sid,{marcadores:ms});updCamp({killer:{ph}});
    return logRoll({kind:'brutal',who,label:'SUA HORA CHEGOU!',dice:[],summary:`${s.name}: ${m.tipo} sobe para ${ms[+i].valor}.`})}
  if(kind==='planos'){if(enc)return toast('Use logo após o fim de um Encontro.');const [rm,add]=arg||[];if(!rm||!add)return toast('Escolha a ação que sai e a que entra.');if(!pay(5))return;
    const ac=kAcoes(k).map(x=>x===rm?add:x);updCamp({killer:{ph,acoes:ac}});
    return logRoll({kind:'brutal',who,label:'MUDANDO DE PLANOS!',dice:[],summary:`${ACOES_U[rm].n} sai, ${ACOES_U[add].n} entra.`})}
  if(kind==='armadilha'){updCamp({killer:{ph:ph+1}});toast('+1 PH (Armadilha no Suspense)')}}

function pedirSusto(free,label){const c=S.camp,k=ck(),enc=c.cena==='encontro';const alvos=S.sheets.filter(s=>s.kind==='pc'&&s.status==='viva').map(s=>s.id);
  if(!alvos.length)return toast('Nenhuma Sobrevivente viva para assustar.');
  if(!free&&enc&&(c.sustosUsados||0)>=(k.sustos||0))return toast(`Limite de ${k.sustos||0} Teste(s) de Susto neste Encontro já foi usado.`);
  updCamp({pedido:{tipo:'susto',alvos,at:Date.now()},sustoFalhas:[],...(enc&&!free?{sustosUsados:(c.sustosUsados||0)+1}:{})});
  if(enc&&c.turno?.id==='killer'&&!free)nextTurn();
  logRoll({kind:'brutal',who:k.nome||'Assassino',label:label||'ASSUSTAR',dice:[],summary:`Teste de Susto pedido a ${alvos.length} Sobrevivente(s).`});toast('Teste de Susto pedido à mesa.')}
async function setCena(c){const p={cena:c};
  if(c==='encontro'&&S.camp.cena!=='encontro'){p.distrair=0;p.rodada=1;p.sustosUsados=0;p.pedido=null;p.mortesEnc=0;p.sangueUsado=false;p.tudoEnc=false;p.sustoFalhas=[];
    for(const s of S.sheets.filter(x=>x.kind==='pc'&&x.status!=='morta')){const sh=getSheet(s.id);const sp={fuga:0};if(sh.status==='escapou')sp.status='viva';
      if(sh.flags?.planejar&&sh.pilha>0){sp.pilha=sh.pilha-1;sp.fuga=1;sp.flags={...sh.flags,planejar:false}}sp.flags={...(sp.flags||sh.flags||{}),habEnc:false};updSheet(s.id,sp)}
    const f=ordem()[0];p.turno={id:f.id,ord:f.ord}}
  if(c!=='encontro'&&S.camp.cena==='encontro'){p.distrair=0;p.turno=null;let fer=0;
    for(const s of S.sheets.filter(x=>x.kind==='pc'&&x.status!=='morta')){const sh=getSheet(s.id);const sp={};const ms=sh.marcadores||[];
      if(ms.some(m=>m.tipo==='Ferida'))fer++;
      if(ms.some(m=>m.tipo==='Segurada'))sp.marcadores=ms.filter(m=>m.tipo!=='Segurada');
      if(sh.fuga){sp.pilha=clamp((sh.pilha||0)+sh.fuga,0,6);sp.fuga=0}if(sh.status==='escapou')sp.status='viva';
      if(Object.keys(sp).length)updSheet(s.id,sp)}
    if(fer){p.killer={ph:(ck().ph||0)+fer};toast(`Intento Horrível: ${fer} Sobrevivente(s) saíram com Ferida. +${fer} PH.`)}}
  updCamp(p);toast('Cena: '+CENAS[c])}
async function newSession(){for(const s of S.sheets.filter(x=>x.kind==='pc'))updSheet(s.id,{apegos:{itemUsado:false,relacaoUsada:false},flags:{habSes:false,tudoSes:false}});S.modal=null;toast('Nova sessão: Apegos, Arriscar Tudo e Habilidades de sessão liberados.')}
async function giveReward(){const ids=Object.keys(S.rw.sel).filter(k=>S.rw.sel[k]);const amt=+S.rw.amt||0;
  if(!ids.length)return toast('Selecione ao menos uma ficha.');if(!amt)return toast('Informe a quantidade.');
  const targets=[];for(const id of ids){const s=getSheet(id);if(!s)continue;
    if(S.rw.kind==='xp')updSheet(id,{xp:(s.xp||0)+amt});else updSheet(id,{pt:clamp((s.pt||0)+amt,0,10)});
    targets.push({id,name:s.name||'Sem nome'})}
  const data={at:Date.now(),by:S.u,amount:amt,kind:S.rw.kind,note:S.rw.note||'',targets,reverted:false};
  const ref=S.db.collection(`campaigns/${S.code}/rewards`).doc();rec({t:'set',path:ref.path,prev:null,next:data});await ref.set(data);
  S.rw={sel:{},amt:1,kind:S.rw.kind,note:''};toast('Recompensa concedida a '+targets.length+' ficha(s).')}
async function revertReward(rid_){const r=S.rewards.find(x=>x.id===rid_);if(!r||r.reverted)return;
  for(const t of r.targets){const s=getSheet(t.id);if(!s)continue;
    if(r.kind==='xp')updSheet(t.id,{xp:Math.max(0,(s.xp||0)-r.amount)});else updSheet(t.id,{pt:clamp((s.pt||0)-r.amount,0,10)})}
  const path=`campaigns/${S.code}/rewards/${rid_}`;rec({t:'updp',path,inv:{reverted:false,revertedAt:null},fwd:{reverted:true,revertedAt:Date.now()}});
  await S.db.doc(path).update({reverted:true,revertedAt:Date.now()});toast('Recompensa revertida.')}
async function resetXP(id){updSheet(id,{xp:0});S.modal=null;toast('XP zerado.')}
async function clearSheet(id){const s=getSheet(id);if(!s)return;delete pend[id];
  const b=s.kind==='npc'?blankNPC():blankPC(s.owner);b.createdBy=s.createdBy;b.createdAt=s.createdAt;
  rec({t:'set',path:sheetRef(id).path,prev:plain(s),next:clone(b)});
  await queue('s'+id,()=>sheetRef(id).set(b));S.modal=null;toast('Ficha limpa. Ctrl+Z desfaz.')}
async function deleteSheet(id){const s=getSheet(id);delete pend[id];if(s)rec({t:'set',path:sheetRef(id).path,prev:plain(s),next:null});
  await sheetRef(id).delete();S.modal=null;if(S.sheetId===id){S.sheetId=null;S.tab=isGM()?'gm':'mine'}toast('Ficha apagada. Ctrl+Z desfaz.');render()}

/* ================= RECORTE DE IMAGEM (capa 16:9, foto 3:4) ================= */
function startCrop(target,file){if(!file)return;if(!/^image\//.test(file.type))return toast('Escolha um arquivo de imagem.');
  const img=new Image();img.onload=()=>{S.crop={target,img,zoom:1,x:0,y:0,aspect:target.k==='cover'?16/9:3/4};S.modal={t:'crop'};render()};img.onerror=()=>toast('Não consegui abrir essa imagem.');
  img.src=URL.createObjectURL(file)}
function cropGeom(W,H,u){const c=S.crop,im=c.img;const base=Math.max(W/im.width,H/im.height),sc=base*c.zoom;const w=im.width*sc,h=im.height*sc;
  const mx=(w-W)/2/u,my=(h-H)/2/u;c.x=clamp(c.x,-mx,mx);c.y=clamp(c.y,-my,my);return{dx:(W-w)/2+c.x*u,dy:(H-h)/2+c.y*u,w,h}}
function drawCrop(){const cv=$('#cropcv');if(!cv||!S.crop)return;const r=cv.getBoundingClientRect();if(!r.width)return;cv.width=Math.round(r.width*devicePixelRatio);cv.height=Math.round(r.height*devicePixelRatio);
  const g=cv.getContext('2d');const q=cropGeom(cv.width,cv.height,cv.width/r.width);g.fillStyle='#000';g.fillRect(0,0,cv.width,cv.height);g.drawImage(S.crop.img,q.dx,q.dy,q.w,q.h)}
async function saveCrop(){const c=S.crop;const disp=$('#cropcv').getBoundingClientRect();const cover=c.target.k==='cover';
  const out=(W,qual)=>{const cv=document.createElement('canvas');cv.width=W;cv.height=Math.round(W/c.aspect);const g=cv.getContext('2d');
    const q=cropGeom(cv.width,cv.height,W/disp.width);g.drawImage(c.img,q.dx,q.dy,q.w,q.h);return cv.toDataURL('image/jpeg',qual)};
  let url;if(cover){url=out(1280,.74);if(url.length>230000)url=out(1024,.66);if(url.length>230000)url=out(800,.6)}
  else{url=out(600,.8);if(url.length>170000)url=out(480,.72);if(url.length>170000)url=out(360,.65)}
  const tg=c.target;S.modal=null;S.crop=null;
  try{if(tg.k==='cover'){if(S.code===tg.code)updCamp({cover:url});else await S.db.doc('campaigns/'+tg.code).update({cover:url});toast('Capa atualizada.')}

const ktag=(x,cls='')=>`<span class="ktag ${cls}">${x}</span>`;

function kcard(o){const now=o.btn&&/<button(?![^>]*disabled)[^>]*>/.test(o.btn);return `<article class="kc ${o.mine===false?'off':''} ${o.mine?'mine':''} ${now?'now':''}"><div class="kc-h"><b>${o.n}</b><span>${now?'<span class="ktag gain">Disponível</span>':''}${o.tags||''}</span></div>

function kNow(){const c=S.camp,k=ck(),enc=c.cena==='encontro',kt=enc&&c.turno?.id==='killer';const pil=k.pilha||0;
  const viv=S.sheets.filter(s=>s.kind==='pc'&&s.status==='viva');const minP=viv.length?Math.min(...viv.map(s=>s.pilha||0)):null;
  const fracas=viv.filter(s=>(s.pilha||0)<pil).map(s=>s.name||'Sem nome');const fim=fimEncontro();let t,d,b='';
  if(enc){
    if(fim){t='O Encontro pode acabar.';d=fim+' Encerre para devolver as Pilhas de Fuga e somar os Intentos automáticos.';b=`<button class="btn kb pri" data-act="cena" data-v="livre">Encerrar Encontro</button>`}
    else if(kt){t='Sua vez, Diretora.';d=`1. Escolha o alvo. 2. Use uma das ações destacadas. A vez passa sozinha. Ferir mata com 6 (1 em 6). ${fracas.length?`MATAR liberado contra: ${fracas.join(', ')}.`:'Ninguém tem menos dados que você, então MATAR ainda não vale.'}${k.ph?` Você tem ${k.ph} PH.`:''}`}

  else{if(minP!=null&&pil>minP){t='Você pode iniciar um Encontro.';d=`Sua Pilha (${pil}) passou a de: ${viv.filter(s=>(s.pilha||0)<pil).map(s=>s.name||'Sem nome').join(', ')}. ${APAV[kApav(k)].cena.includes('Livre')&&kApav(k)==='buh'?'Lembre do Buh! logo no início.':''}`;b=`<button class="btn kb pri" data-act="cena" data-v="encontro">Iniciar Encontro</button>`}

    <div class="ui">Pilha Comum: <b>6 dados</b> · Pontos de Tensão: <b>0</b></div>

  return `<section class="sec"><h2 class="blk">Assistente de criação</h2><div class="steps">${st.map((s,i)=>`<button class="${i===w.step?'on':''}" data-act="wzGo" data-v="${i}" ${i>1&&!w.d.arq?'disabled':''}>${i+1}. ${s}</button>`).join('')}</div>
   <div class="box">${inner}<div class="row" style="justify-content:space-between"><button class="btn" data-act="wzBack">${w.step?'Voltar':'Cancelar'}</button>
   ${w.step<3?`<button class="btn pri" data-act="wzNext" ${w.step===1&&!w.d.arq?'disabled':''}>Próximo</button>`:`<button class="btn pri" data-act="wzDone" ${!a?'disabled':''}>Criar Sobrevivente</button>`}</div></div></section>`}

function slots(n,max,act,id,cls=''){return `<div class="slots">${Array.from({length:max},(_,i)=>`<button class="slot ${cls} ${i<n?'on':''}" data-act="${act}" data-v="${i+1}" data-id="${id}" aria-label="${i+1}"></button>`).join('')}</div>`}

function photoCtl(s){return `<div class="stack" style="gap:8px;justify-items:start">${portrait(s,'lg')}
  <div class="row" style="gap:6px"><label class="btn sm" for="foto-${s.id}">${s.foto?'Trocar foto':'Adicionar foto'}</label><input class="sr" id="foto-${s.id}" type="file" accept="image/*" data-act="fotoFile" data-id="${s.id}">
  ${s.foto?`<button class="btn sm ghost" data-act="rmFoto" data-id="${s.id}">Remover</button>`:''}</div></div>`}

/* ================= FICHA DO JOGADOR ================= */
const HAB={heroina:{auto:'Aplicada sozinha quando você usa Arriscar Tudo para se salvar.'},
  atleta:{rec:'enc',how:'Depois de rolar, troque o resultado de um dado pelo valor de um dos seus Dados Marcadores. Avise a Diretora e ajuste com ela.'},
  valentona:{rec:'enc',how:'Durante um Encontro, descarte um dado da sua Pilha de Fuga. Combine o efeito narrativo com a Diretora.'},
  esbelta:{auto:'Cada 6 que você rolar já soma +1 PT sozinho.'},
  inocente:{rec:'ses',how:'Quando alguém usar Ajudar Alguém em você num Encontro, toque em Usar: quem ajudou recebe de volta os dados doados (vêm do Descarte).'},
  nerd:{rec:'ses',how:'Durante um Encontro, toque em Usar para descobrir quantos dados faltam para completar sua Pilha de Fuga.'},
  relaxada:{rec:'enc',how:'Logo depois de sofrer uma Ferida, toque em Usar para rolar de novo o valor dessa Ferida e ficar com o novo resultado.'},
  cetica:{auto:'Se você falhar num Teste de Susto, o app rola de novo sozinho.'}};
const comb=(n,k)=>{let r=1;for(let i=1;i<=k;i++)r=r*(n-k+i)/i;return r};
function pAtLeast(n,diff,need){if(need<=0)return 1;if(n<need)return 0;const p=clamp((7-diff)/6,0,1);let s=0;for(let k=need;k<=n;k++)s+=comb(n,k)*p**k*(1-p)**(n-k);return s}
const pct=x=>x>=.995?'quase certo':x<=.005?'quase impossível':Math.round(x*100)+'%';
function hasEst(s,e){return !!e&&(s.estilos||[]).includes(e)&&!(s.incap||[]).includes(e)}
function diffOf(s,e,rec){return clamp(4-(hasEst(s,e)?1:0)-(rec?1:0),2,6)}
const isRestr=s=>(s.marcadores||[]).some(m=>m.tipo==='Restrição'&&m.valor>0);
const gq=(k,lbl='Ver no guia')=>`<button class="qmark" data-act="guide" data-v="${k}" aria-label="${lbl}" title="${lbl}">?</button>`;
const habUsed=(s,h)=>h&&h.rec&&(h.rec==='enc'?s.flags?.habEnc:s.flags?.habSes);

function nowPlayer(s){const c=S.camp,k=ck(),enc=c.cena==='encontro',id=s.id;const fa=k.fugaAlvo||6;const falta=Math.max(0,fa-(s.fuga||0));
  const sus=(c.pedido?.alvos||[]).includes(id),seg=(s.marcadores||[]).some(m=>m.tipo==='Segurada');
  const pos=ordem().findIndex(x=>x.id===id)+1,turn=c.turno?.id===id;const perigo=enc&&(s.pilha||0)<(k.pilha||0);
  if(s.status==='morta')return{tone:'dead',t:'Sua Sobrevivente morreu.',d:'Ela sai do jogo. Você pode criar outra ficha na aba Criar ficha, se a Diretora deixar.'};
  if(s.status==='escapou')return{tone:'ok',t:'Você escapou do Encontro.',d:'Fique fora da cena até o Encontro acabar. Quando ele terminar, os dados da Pilha de Fuga voltam para a sua Pilha Comum.'};
  if(sus)return{tone:'red',t:'A Diretora pediu um Teste de Susto.',d:`Role 1 dado da sua Pilha: ${diffOf(s,'',false)}+ passa. Se falhar, o dado é descartado e o Assassino ganha PH.`,
    btn:`<button class="btn pri" data-act="roll" data-v="susto" data-id="${id}" ${s.pilha?'':'disabled'}>Rolar Teste de Susto</button>`};
  if(enc&&turn)return{tone:'red',t:'Sua vez no Encontro.',d:`Escolha uma Ação de Encontro abaixo.${seg?' Você está Segurada: não pode Vazar Dali.':` Para fugir faltam ${falta} dado${falta!==1?'s':''} na Pilha de Fuga.`}${perigo?` Cuidado: você tem menos dados que o Assassino (${k.pilha}), então ele pode te MATAR.`:''}`,guide:'encontro'};
  if(enc){const who=turnName();return{tone:perigo?'warn':'dark',t:`Encontro: vez de ${who}.`,d:`Você age em ${pos}º na Iniciativa. Faltam ${falta} dado${falta!==1?'s':''} para você fugir.${perigo?` Você tem menos dados que o Assassino (${k.pilha}), então ele pode te MATAR na vez dele.`:''}`,guide:'encontro'}}
  if(!(s.pilha||0))return{tone:'warn',t:'Sua Pilha Comum está vazia.',d:'Sem dados você não consegue arriscar testes. Use uma Vantagem que dá dados (Choque de Realidade, Resistir à Dor, Tratar Feridas) ou ganhe PT com Desafios e Apegos.',guide:'pt'};
  const vs=[...VANT_G,...VANT_E.filter(v=>(s.estilos||[]).includes(v.e)&&!(s.incap||[]).includes(v.e))].filter(v=>v.custo!=null&&v.custo<=(s.pt||0)).map(v=>v.n);
  const ap=[s.apegos?.item&&!s.apegos.itemUsado&&'Item Icônico',s.apegos?.relacao&&!s.apegos.relacaoUsada&&'Relação Afetiva',s.apegos?.desejo&&!s.apegos.desejoRevelado&&'Desejo Obscuro'].filter(Boolean);
  const dica=vs.length?` Com ${s.pt} PT você pode usar: ${vs.slice(0,3).join(', ')}${vs.length>3?'…':''}.`:ap.length?` Use um Apego (${ap.join(', ')}) na história para ganhar PT.`:'';
  if(c.cena==='suspense')return{tone:'warn',t:'Suspense: o perigo está perto.',d:'Testes funcionam como na Cena Livre: falhas vão para a Pilha da Diretora. Se a Pilha dela passar a sua, um Encontro pode começar.'+dica,guide:'basico'};
  return{tone:'calm',t:'Cena Livre.',d:'Narre o que sua Sobrevivente faz. Quando a Diretora pedir um teste, escolha quantos dados arriscar e o Estilo abaixo. Falhas vão para a Pilha da Diretora.'+dica,guide:'testes'}}

function sbar(s){const c=S.camp,k=ck(),enc=c.cena==='encontro';
  return `<div class="sbar">${portrait(s,'av')}<b class="sb-n">${esc(s.name||'Sem nome')}</b>
   <span class="sb-i" title="Pilha Comum"><span class="label">Pilha</span><span class="mini">${dots(s.pilha||0,6)}</span><b class="num">${s.pilha||0}</b></span>
   ${enc?`<span class="sb-i" title="Pilha de Fuga"><span class="label">Fuga</span><span class="mini fuga">${dots(s.fuga||0,k.fugaAlvo||6)}</span><b class="num">${s.fuga||0}/${k.fugaAlvo||6}</b></span>`:''}
   <span class="sb-i"><span class="label">PT</span><b class="num">${s.pt||0}</b></span>
   <span class="sb-i sb-k" title="Dados do Assassino"><span class="label">Assassino</span><b class="num">${k.pilha||0}</b></span>
   <span class="sb-c">${enc?`Rodada ${c.rodada||1} · vez de ${esc(turnName())}`:CENAS[c.cena||'livre']}</span></div>`}

function rollPreview(s,n,e,cx,rec,extraSucc=0,lbl){const d_=diffOf(s,e,rec),need=(cx||isRestr(s))?2:1;const p=pAtLeast(n,d_,Math.max(0,need-extraSucc));
  return `<span class="pv"><b>${d_}+</b> · ${need===2?'2 sucessos':'1 sucesso'} · chance <b>${pct(p)}</b>${lbl?' · '+lbl:''}</span>`}

function vSheet(id){const s=getSheet(id);if(!s)return `<p class="label">Ficha não encontrada ou apagada.</p>`;
  const can=isGM()||s.owner===S.u;if(!can)return `<p class="label">Essa ficha pertence a outro jogador.</p>`;
  if(s.kind==='npc')return vNPC(s);
  const a=ARQ[s.arq],k=ck(),c=S.camp,cena=c.cena||'livre',enc=cena==='encontro';const r=S.roll[id]||(S.roll[id]={n:1,estilo:'',complexo:false,recurso:false,alvo:'',ajEst:''});
  r.n=clamp(r.n,1,Math.max(1,s.pilha||0));const res=S.lastRes[id];const allies=S.sheets.filter(x=>x.kind==='pc'&&x.id!==id&&x.status==='viva');
  const est=s.estilos||[];const myV=VANT_E.filter(v=>est.includes(v.e));const now=nowPlayer(s);const tab=S.stab[id]==='vant'?'vant':'pers';
  const dis=s.status!=='viva'?'disabled':'';const myTurn=enc&&c.turno?.id===id;
  const tip=e=>hasEst(s,e)?`${e} (3+)`:`${e} (4+)`;
  const segMe=(s.marcadores||[]).some(m=>m.tipo==='Segurada');const segAlvo=r.alvo&&(getSheet(r.alvo)?.marcadores||[]).some(m=>m.tipo==='Segurada');const restr=(s.marcadores||[]).find(m=>m.tipo==='Restrição');
  const noDice=!s.pilha?'disabled':'';const h=HAB[s.arq];
  const lose=enc?'falhas vão para o Descarte':'falhas vão para a Pilha da Diretora';
  const actCard=(v,nm,e,info,extra='',cls='',dsb='')=>`<button class="act ${cls}" data-act="${v==='folego'?'folego':v==='tudo'?'mTudo':'roll'}" data-v="${v}" data-id="${id}" ${dis||dsb}><b>${nm}</b><span>${info}</span>${extra}</button>`;
  const head=`<div class="now ${now.tone}" role="status"><div class="now-t"><b>${esc(now.t)}</b>${now.guide?gq(now.guide):''}</div><p>${esc(now.d)}</p>${now.btn||''}</div>
  ${sbar(s)}
  <div class="sheet-head">${photoCtl(s)}<div class="grow stack" style="gap:6px"><label class="label" for="sn">Sobrevivente</label><input id="sn" class="name-in" type="text" value="${esc(s.name)}" data-sf="name" placeholder="Nome">
   <div class="row">${a?`<span class="chip" style="background:${a.c}">${a.n} · Iniciativa ${a.ord}</span>`:'<span class="chip out">Escolha um arquétipo abaixo</span>'}${est.map(e=>`<span class="chip ${(s.incap||[]).includes(e)?'inc':'out'}">${e}</span>`).join('')}${s.status!=='viva'?`<span class="state ${s.status}" style="font-size:18px">${s.status}</span>`:''}
   ${isGM()?`<select style="width:auto" aria-label="Situação" data-act="status" data-v="${id}"><option value="viva" ${s.status==='viva'?'selected':''}>Viva</option><option value="escapou" ${s.status==='escapou'?'selected':''}>Escapou</option><option value="morta" ${s.status==='morta'?'selected':''}>Morta</option></select>`:''}
   <span class="ui muted">Jogador: ${s.owner?esc(nmU(s.owner)):'—'}</span></div></div></div>
  <div class="stabs" role="tablist">${[['pers','Personagem'],['vant',`Vantagens e Apegos · ${s.pt||0} PT`]].map(([kk,l])=>`<button role="tab" aria-selected="${tab===kk}" data-act="stab" data-v="${kk}" data-id="${id}">${l}</button>`).join('')}</div>`;

  const pilhas=`<div class="box"><div class="bh"><h3>Pilhas</h3>${gq('basico')}</div>
    <div><div class="kv"><span class="label">Pilha Comum</span><span class="num" style="font-size:22px">${s.pilha||0}/6</span></div>${slots(s.pilha||0,6,'setPilha',id)}<div class="hint">Seus dados para testes. Toque num quadrado para ajustar à mão.</div></div>
    ${enc||s.fuga?`<div><div class="kv"><span class="label">Pilha de Fuga</span><span class="num" style="font-size:22px">${s.fuga||0}/${k.fugaAlvo||6}</span></div>${slots(s.fuga||0,k.fugaAlvo||6,'setFuga',id,'fuga')}<div class="hint">Encha para escapar do Encontro.</div></div>`:''}
   </div>`;
  const ptBox=`<div class="box"><div class="bh"><h3>Pontos</h3>${gq('pt')}</div>
    <div><div class="kv"><span class="label">Pontos de Tensão</span><span class="num" style="font-size:22px">${s.pt||0}/10</span></div><div class="pips">${Array.from({length:10},(_,i)=>`<button class="pip ${i<(s.pt||0)?'on':''}" data-act="setPT" data-v="${i+1}" data-id="${id}" aria-label="${i+1} PT"></button>`).join('')}</div></div>
    <div class="row" style="justify-content:space-between"><div class="field" style="flex:0 0 auto"><span class="label">XP</span><span class="num" style="font-size:26px">${s.xp||0}</span></div><button class="btn sm" data-act="stab" data-v="vant" data-id="${id}">Gastar PT em Vantagens →</button></div>
   </div>`;
  const nStep=`<div class="field" style="flex:0 0 auto"><span class="label">Dados a arriscar</span><div class="stepper"><button data-act="rn" data-d="-1" data-id="${id}" aria-label="Menos dados">−</button><span class="v num">${r.n}</span><button data-act="rn" data-d="1" data-id="${id}" aria-label="Mais dados">+</button></div></div>`;
  const recChk=`<div class="row" style="gap:10px"><div class="field" style="flex:0 0 auto"><span class="label">Recursos</span><div class="stepper"><button data-act="sstep" data-f="recursos" data-d="-1" data-id="${id}" aria-label="Menos recursos">−</button><span class="v num">${s.recursos||0}</span><button data-act="sstep" data-f="recursos" data-d="1" data-id="${id}" aria-label="Mais recursos">+</button></div></div><label class="check" style="align-self:end;min-height:44px"><input type="checkbox" data-rf="recurso" data-id="${id}" ${r.recurso?'checked':''} ${(s.recursos||0)<1?'disabled':''}>Usar Recurso (−1 na dificuldade)${(s.recursos||0)<1?' · você não tem':''}</label></div>`;
  const restrBox=restr?`<div class="flag">Restrição ${restr.valor}: todo teste seu precisa de 2 sucessos.</div><div class="row"><button class="btn sm dark" data-act="roll" data-v="restr" data-e="Ligeiro" data-id="${id}" ${dis||noDice}>Reduzir Restrição (${tip('Ligeiro')})</button><button class="btn sm dark" data-act="roll" data-v="restr" data-e="Sagaz" data-id="${id}" ${dis||noDice}>Reduzir (${tip('Sagaz')})</button></div>`:'';
  const resBox=res?`<div class="result ${res.win?'win':'lose'}" aria-live="polite"><div class="label">${esc(res.label)}</div><div class="dice">${res.dice.map(x=>`<span class="die ${Date.now()-res.at<1200?'new':''} ${x.ok?'ok':'no'}">${x.v}</span>`).join('')}</div>
     <div class="big">${res.win?'Sucesso':'Falha'}</div><div class="ui" style="font-weight:600">${esc(res.summary)}</div>${res.note?`<div class="ui">${esc(res.note)}</div>`:''}<div class="ui muted" style="font-size:15px">Errou algo? Ctrl+Z (ou Desfazer, no topo) devolve os dados.</div></div>`:'';
  let acoes;
  if(enc){const fa=k.fugaAlvo||6;
    acoes=`<div class="box ${myTurn?'hot':''}"><div class="bh"><h3>Ações de Encontro</h3>${gq('encontro')}</div>
     <div class="ui muted">${myTurn?'<b>É a sua vez.</b> Escolha uma ação.':'Você pode preparar a ação enquanto espera a sua vez.'} Vantagens ficam bloqueadas no Encontro. ${esc(lose)}.</div>
     <div class="row">${nStep}${recChk}</div>${restrBox}
     <div class="acts">
      ${actCard('vazar','Vazar Dali','Ligeiro',segMe?'Bloqueado: você está Segurada.':`Teste Ligeiro. Cada sucesso vai para a Fuga; cada 6 puxa mais 1.`,segMe?'':rollPreview(s,r.n,'Ligeiro',false,r.recurso),'',segMe||!s.pilha?'disabled':'')}
      ${actCard('partir','Partir Para Cima','Potente',`Teste Potente. Com 1 sucesso, a Diretora descarta 1 dado.${s.flags?.surpreender?' Surpreender ativo: 1 sucesso garantido.':''}`,rollPreview(s,r.n,'Potente',false,r.recurso,s.flags?.surpreender?1:0),'',noDice)}
      ${actCard('distrair','Distrair','Desenrolado','Teste Complexo Desenrolado. Se passar, MATAR custa à Diretora +1 dado e +3 PH.',rollPreview(s,Math.max(r.n,Math.min(2,s.pilha||0)),'Desenrolado',true,r.recurso),'',(s.pilha||0)<2?'disabled':'')}
      ${actCard('folego','Recuperar Fôlego','','+1 dado na sua Pilha Comum. Sem rolagem.','','',(s.pilha||0)>=6?'disabled':'')}
      ${actCard('tudo','Arriscar Tudo','','Uma Sobrevivente (você ou outra) escapa já. Você descarta todos os seus dados.','','danger')}
     </div>
     <div class="field"><span class="label">Ajudar Alguém</span><div class="row"><label class="sr" for="ra-${id}">Quem ajudar</label><select id="ra-${id}" data-rf="alvo" data-id="${id}" style="flex:1 1 170px"><option value="">Quem ajudar?</option>${allies.map(x=>`<option value="${x.id}" ${r.alvo===x.id?'selected':''}>${esc(x.name||'Sem nome')} (${x.pilha||0}/6)</option>`).join('')}</select>
      <button class="btn sm dark" data-act="roll" data-v="ajudar" data-id="${id}" ${dis||(!r.alvo||!s.pilha?'disabled':'')}>Ajudar</button>
      ${allies.some(x=>(x.marcadores||[]).some(m=>m.tipo==='Segurada'))?`<button class="btn sm dark" data-act="roll" data-v="libertar" data-id="${id}" ${dis||(!segAlvo?'disabled':'')}>Libertar (Complexo, Potente)</button>`:''}</div>
      <span class="label">Como você ajuda? (Estilo)</span><div class="echips">${['',...ESTILOS].map(e=>`<button class="echip ${hasEst(s,e)?'mine':''}" aria-pressed="${(r.ajEst||'')===e}" data-act="ajstyle" data-v="${e}" data-id="${id}"><b>${e||'Sem estilo'}</b><span>${e?(hasEst(s,e)?'seu · 3+':'4+'):'4+'}</span></button>`).join('')}</div>
      <div class="hint">Escolha o Estilo pela forma como você ajuda: carregar é Potente, acalmar é Firme, um plano rápido é Sagaz. Seus sucessos viram dados na Pilha de quem você ajudou. Falhas não são perdidas.${r.alvo?' '+rollPreview(s,r.n,r.ajEst,false,r.recurso):''}</div></div>
     ${resBox}</div>`}
  else{const sel=r.estilo;
    acoes=`<div class="box"><div class="bh"><h3>Arriscar dados</h3>${gq('testes')}</div>
     <ol class="steps2"><li>Quando a Diretora pedir um teste, escolha quantos dados arriscar.</li><li>Escolha o Estilo que combina com a ação. Os seus deixam o teste mais fácil.</li><li>Role. Cada dado com o número indicado ou mais é um sucesso, e ${esc(lose)}.</li></ol>
     <div class="row">${nStep}<div class="field" style="flex:0 0 auto"><span class="label">Dificuldade do teste</span><div class="seg"><button aria-pressed="${!r.complexo}" data-act="rcx" data-v="0" data-id="${id}">Comum · 1 sucesso</button><button aria-pressed="${r.complexo}" data-act="rcx" data-v="1" data-id="${id}">Complexo · 2</button></div></div></div>
     <div class="field"><span class="label">Estilo</span><div class="echips">${['',...ESTILOS].map(e=>`<button class="echip ${hasEst(s,e)?'mine':''}" aria-pressed="${sel===e}" data-act="rstyle" data-v="${e}" data-id="${id}"><b>${e||'Sem estilo'}</b><span>${e?(hasEst(s,e)?'seu · 3+':(s.incap||[]).includes(e)?'incapacitado · 4+':'4+'):'4+'}</span></button>`).join('')}</div></div>
     ${recChk}${restrBox}
     <div class="rollbar"><button class="btn pri big" data-act="roll" data-v="teste" data-id="${id}" ${dis||noDice}>Arriscar ${r.n} dado${r.n>1?'s':''}</button>${rollPreview(s,r.n,sel,r.complexo,r.recurso,0,`em falha, até ${r.n} dado${r.n>1?'s':''} para a Diretora`)}</div>
     <div class="row"><button class="btn sm" data-act="roll" data-v="susto" data-id="${id}" ${dis||noDice}>Teste de Susto</button><span class="hint">Só quando a Diretora pedir. Rola 1 dado.</span></div>
     ${resBox}</div>`}

  const habBox=a?`<div class="hab hab-box"><span class="label">Habilidade</span><span class="n">${a.hab}</span><span>${a.ht.replace(/ \((Aplicad|Repeti)[^)]*\)/,'')}</span>
    ${h?.auto?`<div class="hint">${h.auto}</div>`:`<div class="row"><button class="btn sm dark" data-act="hab" data-id="${id}" ${dis||(habUsed(s,h)?'disabled':'')}>${habUsed(s,h)?'Usada':'Usar habilidade'}</button><span class="hint">${habUsed(s,h)?(h.rec==='enc'?'Volta no próximo Encontro.':'Volta na próxima sessão.'):(h.rec==='enc'?'1 vez por Encontro.':'1 vez por sessão.')} ${h.how||''}</span></div>`}</div>`:'';
  const ident=`<div class="box" style="padding:0;gap:0">${a?`<div class="arq-band" style="background:${a.c}"><span class="t">${a.n}</span><span class="s">${a.tr} · Iniciativa ${a.ord}</span></div>`:''}
    <div style="padding:16px;display:grid;gap:14px">
     <div class="field"><div class="bh"><label class="label" for="sa">Arquétipo</label>${gq('arq')}</div><select id="sa" data-act="arq" data-id="${id}"><option value="">— escolher —</option>${Object.entries(ARQ).map(([kk,v])=>`<option value="${kk}" ${s.arq===kk?'selected':''}>${v.n}</option>`).join('')}</select></div>
     <div><div class="label" style="margin-bottom:6px">Estilos <span style="text-transform:none;letter-spacing:0;font-weight:500">(toque para incapacitar ou recuperar)</span></div><div class="row">${est.length?est.map(e=>`<button class="chip ${(s.incap||[]).includes(e)?'inc':'out'}" style="cursor:pointer;font-size:16px;padding:6px 12px" data-act="incap" data-v="${e}" data-id="${id}">${e}</button>`).join(''):'<span class="muted">Escolha um arquétipo.</span>'}</div>
      <div class="hint">${est.map(e=>`<b>${e}</b>: ${ESTILO_INFO[e]}`).join(' ')}</div></div>
     ${habBox}
    </div></div>`;

  const marks=`<div class="box"><div class="bh"><h3>Ferimentos e condições</h3>${gq('marcadores')}</div>

    <span class="label">Dados Marcadores</span>
    ${(s.marcadores||[]).length?(s.marcadores.map((m,i)=>`<div class="mark"><select style="width:auto;flex:1 1 140px" aria-label="Tipo" data-act="mtype" data-i="${i}" data-id="${id}">${MARK_T.map(t=>`<option ${m.tipo===t?'selected':''}>${t}</option>`).join('')}</select>
      <div class="stepper"><button data-act="mstep" data-i="${i}" data-d="-1" data-id="${id}" aria-label="Diminuir">−</button><span class="v num"><span class="die sm" style="margin:auto">${m.valor}</span></span><button data-act="mstep" data-i="${i}" data-d="1" data-id="${id}" aria-label="Aumentar">+</button></div>
      <button class="btn sm ghost" data-act="mdel" data-i="${i}" data-id="${id}" aria-label="Remover marcador">✕</button><div class="hint" style="flex-basis:100%">${esc(MARK_INFO[m.tipo]||'')}</div></div>`).join('')):'<span class="muted">Nenhuma condição. Feridas, Possessões e Restrições aparecem aqui quando o Assassino age.</span>'}

   </div>`;

  let body='';
  if(tab==='pers')body=`<div class="cols"><section class="sec">${pilhas}${acoes}</section>
   <section class="sec">${ident}${marks}${ptBox}
    <div class="box"><h3>Conceito</h3><textarea id="sc" data-sf="conceito" placeholder="Quem ela é, de onde vem, por que está aqui.">${esc(s.conceito)}</textarea></div>

  if(tab==='vant'){const incAll=[s,...allies].filter(x=>(x.incap||[]).length);

   <div class="box"><div class="bh"><h3>Vantagens</h3>${gq('pt')}</div><p class="muted ui" style="margin:0">${enc?'<b>Bloqueadas durante o Encontro.</b> ':''}Gastam Pontos de Tensão e só valem fora do Encontro. Você tem <b>${s.pt||0} PT</b>.</p>

       <div class="meta">Recarga: ${v.rec}${off?' · Estilo incapacitado':''}${falta?` · faltam ${custo-(s.pt||0)} PT`:''}${v.k==='surpreender'&&s.flags?.surpreender?' · ATIVA':''}${v.k==='planejar'&&s.flags?.planejar?' · ATIVA':''}</div></div>`}).join('')}
   </div></section>
   <section class="sec"><div class="box"><div class="bh"><h3>Apegos</h3>${gq('pt')}</div><p class="muted ui" style="margin:0">Use na história e toque no botão para receber os PT.</p>

    <div class="field"><label class="label" for="ar">Relação Afetiva · +2 PT, 1 vez por sessão</label><div class="row"><input id="ar" class="grow" type="text" value="${esc(s.apegos?.relacao)}" data-sf="apegos.relacao" placeholder="Pessoa ou animal que é seu porto-seguro"><button class="btn sm" data-act="apego" data-v="relacao" data-id="${id}" ${s.apegos?.relacaoUsada||!s.apegos?.relacao?'disabled':''}>${s.apegos?.relacaoUsada?'Visitada':'Visitar +2 PT'}</button></div></div>
    <div class="field"><label class="label" for="ad">Desejo Obscuro · +3 PT, uma única vez</label><textarea id="ad" data-sf="apegos.desejo" placeholder="O segredo que ela guarda a sete chaves">${esc(s.apegos?.desejo)}</textarea><div><button class="btn sm" data-act="apego" data-v="desejo" data-id="${id}" ${s.apegos?.desejoRevelado||!s.apegos?.desejo?'disabled':''}>${s.apegos?.desejoRevelado?'Revelado':'Revelar +3 PT'}</button></div></div>
   </div>
   <div class="box"><h3>Outras formas de ganhar PT</h3><p style="margin:0">Desafios: tomar um shot ou fazer algo clichê de filme slasher (checar o barulho no sótão, atender a porta de madrugada). A Diretora decide quantos PT vale e dá pela área dela.</p></div></section></div>`}
  return head+body}

function guideNow(){const c=S.camp;if(!c)return [{t:'Escolha uma campanha',d:'Entre numa campanha para ver o que dá para fazer agora.'}];
  const k=ck(),enc=c.cena==='encontro',out=[];
  if(isGM()){const viv=S.sheets.filter(s=>s.kind==='pc'&&s.status==='viva');const minP=viv.length?Math.min(...viv.map(s=>s.pilha||0)):null;
    out.push({t:'Cena: '+CENAS[c.cena||'livre'],d:enc?`Rodada ${c.rodada||1}. Vez de ${turnName()}.`:'Narre, peça testes e colete as falhas na sua Pilha.'});
    if(!enc){out.push({t:'Assustar',d:'Peça um Teste de Susto quando algo assustar o grupo. Falhas dão PH.'});
      if(minP!=null&&(k.pilha||0)>minP)out.push({t:'Você já pode iniciar um Encontro',d:`Sua Pilha (${k.pilha}) passou a menor Pilha da mesa (${minP}).`});
      else out.push({t:'Ainda não dá para iniciar um Encontro',d:`Sua Pilha (${k.pilha||0}) precisa passar a menor Pilha da mesa (${minP??'—'}). Peça mais testes.`})}
    else if(c.turno?.id==='killer')out.push({t:'Sua vez',d:'Abra a ficha do Assassino, escolha o alvo e uma ação. Ferir mata com 6. Matar exige alvo com menos dados que você. A vez passa sozinha depois.'});
    else out.push({t:'Vez de uma Sobrevivente',d:'A vez passa sozinha quando ela usa uma Ação de Encontro. Se ela só narrou, toque em Próximo turno.'});
    return out}
  const s=getSheet(S.sheetId)?.owner===S.u?getSheet(S.sheetId):S.sheets.find(x=>x.kind==='pc'&&x.owner===S.u&&x.status==='viva')||S.sheets.find(x=>x.kind==='pc'&&x.owner===S.u);
  if(!s)return [{t:'Você ainda não tem Sobrevivente',d:'Vá em Criar ficha. O assistente leva menos de 2 minutos.'}];
  const n=nowPlayer(s);out.push({t:n.t,d:n.d});
  if(enc){const turn=c.turno?.id===s.id;out.push({t:turn?'Escolha uma destas ações':'Quando chegar a sua vez',d:'Vazar Dali para fugir, Partir Para Cima para tirar dados do Assassino, Distrair para encarecer o MATAR, Ajudar Alguém, Recuperar Fôlego ou Arriscar Tudo.'});
    out.push({t:'Dificuldade para você',d:['Ligeiro','Potente','Desenrolado'].map(e=>`${e} ${hasEst(s,e)?'3+':'4+'}`).join(' · ')})}
  else{out.push({t:'Testes',d:`Seus Estilos (${(s.estilos||[]).join(' e ')||'—'}) testam com 3+. Os outros, com 4+.`});
    const vs=[...VANT_G,...VANT_E.filter(v=>(s.estilos||[]).includes(v.e))].filter(v=>v.custo!=null&&v.custo<=(s.pt||0));
    out.push({t:`Vantagens (${s.pt||0} PT)`,d:vs.length?vs.map(v=>`${v.n} (${v.custo})`).join(', '):'Nenhuma ao seu alcance agora. Ganhe PT com Desafios e Apegos.'})}
  return out}

function gItem(it){return `<div class="g-it"><div class="g-h"><b>${esc(it.t)}</b>${it.tag?`<span class="g-tag">${esc(it.tag)}</span>`:''}</div><p>${esc(it.d)}</p></div>`}
function vGuide(){const g=S.guide;
  const btn=`<button class="guide-btn" data-act="guideToggle" aria-expanded="${g.open}" aria-controls="guide" title="Guia de jogo (G)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M4 19.5V5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M8 7h7M8 11h5"/></svg><span>Guia</span></button>`;
  if(!g.open)return btn;
  const secs=GUIDE.filter(s=>!s.gm||isGM());const q=normTxt(g.q||'');
  let body;
  if(q){const hits=secs.flatMap(s=>s.items.filter(it=>normTxt(it.t+' '+it.d+' '+(it.tag||'')).includes(q)).map(it=>({...it,sec:s.n})));
    body=hits.length?hits.map(h=>gItem({...h,tag:h.sec+(h.tag?' · '+h.tag:'')})).join(''):`<p class="muted">Nada encontrado para “${esc(g.q)}”.</p>`}
  else if(g.tab==='agora')body=`<p class="g-lead">O que você pode fazer neste momento.</p>${guideNow().map(gItem).join('')}`;
  else{const sc=secs.find(s=>s.k===g.tab)||secs[0];body=sc.items.map(gItem).join('')}
  return btn+`<div class="g-scrim" data-act="guideClose"></div><aside class="guide" id="guide" role="dialog" aria-label="Guia de jogo">
   <div class="g-top"><b>Guia de jogo</b><button class="btn sm" data-act="guideClose" aria-label="Fechar guia">Fechar</button></div>

    ${why?`<div class="err">${esc(why)}</div>`:''}<div class="row" style="justify-content:flex-end"><button class="btn" data-act="close">Cancelar</button><button class="btn pri" data-act="tudoYes" ${why?'disabled':''}>Arriscar tudo</button></div>`}

    <div class="row" style="justify-content:flex-end"><button type="button" class="btn" data-act="close">Cancelar</button><button class="btn pri" type="submit">Salvar</button></div></form>`;

    <p class="muted ui" style="margin:0">A ficha começa em branco e você pode trocar o jogador a qualquer momento na lista.</p><div class="row" style="justify-content:flex-end"><button class="btn" data-act="close">Cancelar</button><button class="btn pri" data-act="gmpcYes">Criar ficha</button></div>`;
  if(m.t==='crop'){const cover=S.crop?.target.k==='cover';
    c=`<h2>${cover?'Ajustar capa':'Ajustar foto'}</h2><div class="crop-wrap ${cover?'':'tall'}" id="cropwrap" style="aspect-ratio:${cover?'16/9':'3/4'}"><canvas id="cropcv"></canvas></div>

    <p class="muted ui" style="margin:0">Arraste a imagem para enquadrar e use o zoom (ou a roda do mouse). A área visível é exatamente o que fica ${cover?'na capa (16:9)':'na foto da ficha (3:4)'}.</p>

function render(){const a=document.activeElement;const fid=a&&a.id;let ss,se;try{ss=a.selectionStart;se=a.selectionEnd}catch(e){}
  const sy=window.scrollY;const ll=$('.log-ls')?.scrollTop;
  let h='';if(S.view==='login')h=vLogin();else if(S.view==='home')h=vHome();else if(S.view==='camp')h=vCamp();else if(S.view==='nodb'||S.view==='nofb')h=vNoDb();else if(S.view==='boot')h=`<div class="center"><div><div class="logo">BRUTAL</div><p class="label">Abrindo a mesa…</p></div></div>`;
  $('#app').innerHTML=h+vModal()+((S.view==='camp'||S.view==='home')?vGuide():'');
  if(fid){const e=document.getElementById(fid);if(e){e.focus({preventScroll:true});try{if(ss!=null)e.setSelectionRange(ss,se)}catch(x){}}}
  window.scrollTo(0,sy);const l=$('.log-ls');if(l&&ll!=null)l.scrollTop=ll;
  if(S.modal?.t==='crop')requestAnimationFrame(drawCrop)}
function vNoDb(){return `<div class="center"><div class="stack" style="max-width:520px"><div class="logo">BRUTAL</div><div class="err">Não consegui carregar o Firebase.</div>
